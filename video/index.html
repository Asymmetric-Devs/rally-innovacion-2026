<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>PolliNode - Rally 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="kit.js"></script>
    <link rel="stylesheet" href="style.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a1a13;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0a1a13;
        background-image: linear-gradient(rgba(34, 60, 45, 0.55) 1px, transparent 1px), linear-gradient(90deg, rgba(34, 60, 45, 0.55) 1px, transparent 1px);
        background-size: 64px 64px;
      }
      #chrome {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 130px;
        z-index: 50;
        pointer-events: none;
        font-family: "IBM Plex Mono", monospace;
      }
      .ch-label {
        position: absolute;
        left: 120px;
        top: 52px;
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #c8f25c;
        opacity: 0;
      }
      .ch-label i {
        display: block;
        width: 48px;
        height: 2px;
        background: #c8f25c;
      }
      .ch-count {
        position: absolute;
        right: 120px;
        top: 52px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #9db3a4;
        opacity: 0;
      }
      .wipe {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        z-index: 100;
        pointer-events: none;
        will-change: transform;
      }
      #wipeA {
        background: #c8f25c;
      }
      #wipeB {
        background: #0a1a13;
        z-index: 101;
      }
    </style>
  </head>
  <body>
    <!-- Duración total: 110 s. Cada escena dura lo que su voz más un respiro. -->
    <div data-hf-id="hf-agh4"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="110"
      data-width="1920"
      data-height="1080"
    >
      <div data-hf-id="hf-b3b2" id="s1-hook" data-composition-id="s1-hook" data-composition-src="compositions/s1-hook.html" data-start="0" data-duration="8" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-olfl" id="s2-problema" data-composition-id="s2-problema" data-composition-src="compositions/s2-problema.html" data-start="8" data-duration="18" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-di67" id="s3-islas" data-composition-id="s3-islas" data-composition-src="compositions/s3-islas.html" data-start="26" data-duration="18.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-lbvb" id="s4-pizarron" data-composition-id="s4-pizarron" data-composition-src="compositions/s4-pizarron.html" data-start="44.5" data-duration="25" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-ta8a" id="s5-tecnologia" data-composition-id="s5-tecnologia" data-composition-src="compositions/s5-tecnologia.html" data-start="69.5" data-duration="19" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-yexc" id="s6-impacto" data-composition-id="s6-impacto" data-composition-src="compositions/s6-impacto.html" data-start="88.5" data-duration="12.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-w2q2" id="s7-cierre" data-composition-id="s7-cierre" data-composition-src="compositions/s7-cierre.html" data-start="101" data-duration="9" data-track-index="1" data-width="1920" data-height="1080"></div>

      <!-- voces en off (cada una empieza 0,5 s después de su escena); los bordes ya tienen fundidos -->
      <audio data-hf-id="hf-444w" id="vo1" src="assets/vo/vo1-gancho.m4a" data-start="0.5" data-duration="6.44" data-track-index="2" data-volume="1"></audio>
      <audio data-hf-id="hf-fz8h" id="vo2" src="assets/vo/vo2-problema.m4a" data-start="8.5" data-duration="16.35" data-track-index="2" data-volume="1"></audio>
      <audio data-hf-id="hf-iogb" id="vo3" src="assets/vo/vo3-solucion.m4a" data-start="26.5" data-duration="17.12" data-track-index="2" data-volume="1"></audio>
      <audio data-hf-id="hf-4tmk" id="vo5" src="assets/vo/vo5-tecnologia.m4a" data-start="70" data-duration="17.43" data-track-index="2" data-volume="1"></audio>
      <audio data-hf-id="hf-k1qi" id="vo6" src="assets/vo/vo6-impacto.m4a" data-start="89" data-duration="10.88" data-track-index="2" data-volume="1"></audio>
      <audio data-hf-id="hf-ksgs" id="vo7" src="assets/vo/vo7-cierre.m4a" data-start="101.5" data-duration="6.22" data-track-index="2" data-volume="1"></audio>

      <!-- música de fondo: "Dreamy Flashback", Kevin MacLeod (CC BY 4.0). Baja bajo la toma del pizarrón. -->
      <audio data-hf-id="hf-gf1v"

        data-start="0"

      <div data-hf-id="hf-rwb7" id="chrome">
        <div data-hf-id="hf-gh1h" id="chl-2" class="ch-label"><i data-hf-id="hf-wt6k"></i>El problema</div><div data-hf-id="hf-0r0y" id="chc-2" class="ch-count">02 / 07</div>
        <div data-hf-id="hf-acmu" id="chl-3" class="ch-label"><i data-hf-id="hf-zeb8"></i>La solución</div><div data-hf-id="hf-n3y0" id="chc-3" class="ch-count">03 / 07</div>

      </div>
      <div data-hf-id="hf-zhnn" id="wipeA" class="wipe"></div>
      <div data-hf-id="hf-qtrs" id="wipeB" class="wipe"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // cabecera por escena (etiqueta con línea lima y contador)
      const S = [
        { a: 8, b: 26, id: "2" },
        { a: 26, b: 44.5, id: "3" },
        { a: 69.5, b: 88.5, id: "5" },
        { a: 88.5, b: 101, id: "6" },
      ];
      tl.set([".ch-label", ".ch-count"], { opacity: 0 }, 0);
      S.forEach((s) => {
        tl.fromTo("#chl-" + s.id, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, s.a + 0.5);
        tl.fromTo("#chc-" + s.id, { opacity: 0 }, { opacity: 1, duration: 0.6 }, s.a + 0.6);
        tl.to(["#chl-" + s.id, "#chc-" + s.id], { opacity: 0, duration: 0.3 }, s.b - 0.55);
      });

      // cortina: lima primero, bosque oscuro detrás; cubre y descubre de izquierda a derecha
      tl.set(["#wipeA", "#wipeB"], { xPercent: -101 }, 0);
      [8, 26, 44.5, 69.5, 88.5, 101].forEach((T) => {
        tl.set("#wipeA", { xPercent: -101 }, T - 0.56);
        tl.set("#wipeB", { xPercent: -101 }, T - 0.48);
        tl.to("#wipeA", { xPercent: 0, duration: 0.5, ease: "power3.inOut" }, T - 0.55);
        tl.to("#wipeB", { xPercent: 0, duration: 0.5, ease: "power3.inOut" }, T - 0.47);
        tl.to("#wipeA", { xPercent: 101, duration: 0.5, ease: "power3.inOut" }, T + 0.05);
        tl.to("#wipeB", { xPercent: 101, duration: 0.5, ease: "power3.inOut" }, T + 0.13);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
