<!doctype html>

    <script src="kit.js"></script>
    <link rel="stylesheet" href="style.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f2f6e6;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f2f6e6;
      }
      #chrome {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 130px;
        z-index: 50;
        pointer-events: none;
        font-family: "IBM Plex Mono", monospace;
      }
      .ch-label {
        position: absolute;
        left: 120px;
        top: 52px;
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #4f8a0b;
        opacity: 0;
      }
      .ch-label i {
        display: block;
        width: 48px;
        height: 2px;
        background: #8cc21f;
      }
      .ch-count {
        position: absolute;
        right: 120px;
        top: 52px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #5a7564;
        opacity: 0;
      }
      .wipe {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        z-index: 100;
        pointer-events: none;
        will-change: transform;
      }
      #wipeA {
        background: #c8f25c;
      }
      #wipeB {
        background: #f2f6e6;
        z-index: 101;
      }
    </style>
  </head>
  <body>

      <div data-hf-id="hf-qtrs" id="wipeB" class="wipe"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // cabecera por escena (etiqueta con línea lima y contador)
      const S = [
        { a: 6.7, b: 29, id: "2" },
        { a: 29, b: 44.7, id: "3" },
        { a: 44.7, b: 61.1, id: "4" },
        { a: 83.6, b: 100.3, id: "6" },
        { a: 100.3, b: 111.05, id: "7" },
      ];
      tl.set([".ch-label"], { opacity: 0 }, 0);
      S.forEach((s) => {
        tl.fromTo("#chl-" + s.id, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, s.a + 0.5);
        tl.to("#chl-" + s.id, { opacity: 0, duration: 0.3 }, s.b - 0.55);
      });

      // cortina: lima primero, bosque oscuro detrás; cubre y descubre de izquierda a derecha
      tl.set(["#wipeA", "#wipeB"], { xPercent: -101 }, 0);
      [6.7, 29, 44.7, 61.1, 83.6, 100.3, 111.05].forEach((T) => {
        tl.set("#wipeA", { xPercent: -101 }, T - 0.56);
        tl.set("#wipeB", { xPercent: -101 }, T - 0.48);
        tl.to("#wipeA", { xPercent: 0, duration: 0.5, ease: "power3.inOut" }, T - 0.55);
        tl.to("#wipeB", { xPercent: 0, duration: 0.5, ease: "power3.inOut" }, T - 0.47);
        tl.to("#wipeA", { xPercent: 101, duration: 0.5, ease: "power3.inOut" }, T + 0.05);
        tl.to("#wipeB", { xPercent: 101, duration: 0.5, ease: "power3.inOut" }, T + 0.13);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
