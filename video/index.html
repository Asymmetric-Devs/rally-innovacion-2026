<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>PolliNode - Rally 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="kit.js"></script>
    <style>
      @font-face {
        font-family: "Instrument Serif";
        font-style: normal;
        src: url("assets/fonts/InstrumentSerif-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "Instrument Serif";
        font-style: italic;
        src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2");
      }
      @font-face {
        font-family: "Instrument Sans";
        font-weight: 400 700;
        src: url("assets/fonts/InstrumentSans.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f4efe6;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f4efe6;
      }
      #chrome {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 130px;
        z-index: 50;
        pointer-events: none;
        font-family: "Instrument Sans", sans-serif;
        color: #1d1b19;
      }
      .ch-label {
        position: absolute;
        left: 120px;
        top: 58px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0;
      }
      .ch-label b {
        font-weight: 600;
        color: #a8401f;
        margin-right: 18px;
      }
      #chl-5 b {
        color: #f0966f;
      }
      #ch-ticks {
        position: absolute;
        right: 120px;
        top: 62px;
        width: 330px;
        height: 24px;
        opacity: 0;
      }
      .wipe {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        z-index: 100;
        pointer-events: none;
        will-change: transform;
      }
      #wipeA {
        background: #1d1b19;
      }
      #wipeB {
        background: #c4502f;
        z-index: 101;
      }
    </style>
  </head>
  <body>
    <!-- Recursos globales: tramas de rayado -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <pattern id="hatch-clay" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="11" stroke="#c4502f" stroke-width="2.6" /></pattern>
        <pattern id="hatch-ink" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="11" stroke="#1d1b19" stroke-width="2" /></pattern>
      </defs>
    </svg>

    <!-- Duración total: 103 s. Cada escena dura lo que su voz + un respiro. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="103"
      data-width="1920"
      data-height="1080"
    >
      <div id="s1-hook" data-composition-id="s1-hook" data-composition-src="compositions/s1-hook.html" data-start="0" data-duration="8" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s2-problema" data-composition-id="s2-problema" data-composition-src="compositions/s2-problema.html" data-start="8" data-duration="18" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s3-islas" data-composition-id="s3-islas" data-composition-src="compositions/s3-islas.html" data-start="26" data-duration="18.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s4-pizarron" data-composition-id="s4-pizarron" data-composition-src="compositions/s4-pizarron.html" data-start="44.5" data-duration="18" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s5-tecnologia" data-composition-id="s5-tecnologia" data-composition-src="compositions/s5-tecnologia.html" data-start="62.5" data-duration="19" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s6-impacto" data-composition-id="s6-impacto" data-composition-src="compositions/s6-impacto.html" data-start="81.5" data-duration="12.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s7-cierre" data-composition-id="s7-cierre" data-composition-src="compositions/s7-cierre.html" data-start="94" data-duration="9" data-track-index="1" data-width="1920" data-height="1080"></div>

      <!-- voces en off (cada una empieza 0,5 s después de su escena) -->
      <audio id="vo1" src="assets/vo/vo1-gancho.m4a" data-start="0.5" data-duration="6.44" data-track-index="2" data-volume="1"></audio>
      <audio id="vo2" src="assets/vo/vo2-problema.m4a" data-start="8.5" data-duration="16.35" data-track-index="2" data-volume="1"></audio>
      <audio id="vo3" src="assets/vo/vo3-solucion.m4a" data-start="26.5" data-duration="17.12" data-track-index="2" data-volume="1"></audio>
      <audio id="vo5" src="assets/vo/vo5-tecnologia.m4a" data-start="63" data-duration="17.43" data-track-index="2" data-volume="1"></audio>
      <audio id="vo6" src="assets/vo/vo6-impacto.m4a" data-start="82" data-duration="10.88" data-track-index="2" data-volume="1"></audio>
      <audio id="vo7" src="assets/vo/vo7-cierre.m4a" data-start="94.5" data-duration="6.22" data-track-index="2" data-volume="1"></audio>

      <div id="chrome">
        <div id="chl-2" class="ch-label"><b>02</b>El problema</div>
        <div id="chl-3" class="ch-label"><b>03</b>La solución</div>
        <div id="chl-5" class="ch-label"><b>05</b>La tecnología</div>
        <div id="chl-6" class="ch-label"><b>06</b>El impacto</div>
        <svg id="ch-ticks" viewBox="0 0 330 24"></svg>
      </div>
      <div id="wipeA" class="wipe"></div>
      <div id="wipeB" class="wipe"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // progreso: 7 marcas finas, la actual en arcilla
      const ticksSvg = document.getElementById("ch-ticks");
      const ticks = [];
      for (let i = 0; i < 7; i++) ticks.push(PN.mk(ticksSvg, "rect", { x: i * 48, y: 10, width: 36, height: 4, fill: "#1d1b19", opacity: 0.22 }));

      // escenas: inicio, fin, y si muestran cabecera ("" = oculta), con modo oscuro
      const S = [
        { a: 0, b: 8, label: "", dark: false },
        { a: 8, b: 26, label: "chl-2", dark: false },
        { a: 26, b: 44.5, label: "chl-3", dark: false },
        { a: 44.5, b: 62.5, label: "", dark: false },
        { a: 62.5, b: 81.5, label: "chl-5", dark: true },
        { a: 81.5, b: 94, label: "chl-6", dark: false },
        { a: 94, b: 103, label: "", dark: false },
      ];
      tl.set("#chrome", { color: "#1d1b19" }, 0);
      S.forEach((s, i) => {
        if (!s.label) return;
        const col = s.dark ? "#f4efe6" : "#1d1b19";
        tl.fromTo("#" + s.label, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, s.a + 0.5);
        tl.to("#" + s.label, { opacity: 0, duration: 0.3 }, s.b - 0.5);
        tl.set("#" + s.label, { color: col }, 0);
        tl.to("#ch-ticks", { opacity: 1, duration: 0.5 }, s.a + 0.5);
        tl.to("#ch-ticks", { opacity: 0, duration: 0.3 }, s.b - 0.5);
        tl.set("#ch-ticks rect", { fill: col }, s.a + 0.4);
        tl.set(ticks, { fill: col, opacity: 0.22 }, s.a + 0.4);
        tl.set(ticks[i], { fill: "#c4502f", opacity: 1 }, s.a + 0.45);
      });

      // cortina: tinta primero, arcilla detrás; cubre y descubre de izquierda a derecha
      tl.set(["#wipeA", "#wipeB"], { xPercent: -101 }, 0);
      [8, 26, 44.5, 62.5, 81.5, 94].forEach((T) => {
        tl.set("#wipeA", { xPercent: -101 }, T - 0.56);
        tl.set("#wipeB", { xPercent: -101 }, T - 0.48);
        tl.to("#wipeA", { xPercent: 0, duration: 0.5, ease: "power3.inOut" }, T - 0.55);
        tl.to("#wipeB", { xPercent: 0, duration: 0.5, ease: "power3.inOut" }, T - 0.47);
        tl.to("#wipeA", { xPercent: 101, duration: 0.5, ease: "power3.inOut" }, T + 0.05);
        tl.to("#wipeB", { xPercent: 101, duration: 0.5, ease: "power3.inOut" }, T + 0.13);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
