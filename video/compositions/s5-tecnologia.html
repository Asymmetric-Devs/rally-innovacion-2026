      <script>
        (function () {
          const mk = PN.mk;
          const DUR = 25;
          const lerp = (a, b, t) => a + (b - a) * t;
          const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
          const mix = (c1, c2, t) => {
            const a = hex(c1), b = hex(c2);
            return "rgb(" + a.map((v, i) => Math.round(lerp(v, b[i], t))).join(",") + ")";
          };
          // frío (zona muerta) → amarillo → magenta (alta polinización)
          const heatColor = (v) => (v < 0.5 ? mix("#19c3e6", "#ffd23f", v / 0.5) : mix("#ffd23f", "#ff3d8b", (v - 0.5) / 0.5));
          const $ = (id) => document.getElementById(id);

          const heads = ["#s5-ha", "#s5-hb", "#s5-hc"].map((id) => PN.words(document.querySelector(id)));

          // A: nubes, sol, pasto, flores, arcos LoRa, abeja
          const cl = $("s5-clouds");
          [[640, 120, 1], [820, 210, 0.7]].forEach((c) => {
            const g = mk(cl, "g", { transform: "translate(" + c[0] + " " + c[1] + ") scale(" + c[2] + ")" });
            mk(g, "path", { d: "M -90 30 Q -110 -10 -60 -14 Q -50 -60 0 -50 Q 40 -80 80 -40 Q 130 -40 120 10 Q 130 34 90 36 Z", fill: "#fff1d6", stroke: "#17132b", "stroke-width": 7, "stroke-linejoin": "round" });
          });
          const raysG = $("s5-sun-rays");
          for (let i = 0; i < 12; i++) {
            const a = (i / 12) * Math.PI * 2;
            mk(raysG, "line", { x1: Math.cos(a) * 58, y1: Math.sin(a) * 58, x2: Math.cos(a) * 82, y2: Math.sin(a) * 82 });
          }
          const grassG = $("s5-grass");
          const grnd = PN.rng(7);
          const blades = [];
          for (let i = 0; i < 40; i++) {
            const x = 8 + i * 23.5 + grnd() * 8;
            const h = 30 + grnd() * 40;
            const g = mk(grassG, "path", { d: "M " + x + " 780 q -6 " + -h * 0.5 + " 2 " + -h + " q 11 " + h * 0.5 + " 6 " + h + " Z", fill: i % 3 ? "#ff3d8b" : "#ffd23f", stroke: "#17132b", "stroke-width": 4, "stroke-linejoin": "round" });
            blades.push({ el: g, x: x, k: grnd() * 6.28 });
          }
          const gfl = [];
          [[90, 740], [250, 748], [700, 744], [850, 738], [570, 752]].forEach((p, i) => {
            mk($("s5-gflowers"), "line", { x1: p[0], y1: p[1], x2: p[0], y2: 780, stroke: "#17132b", "stroke-width": 7, "stroke-linecap": "round" });
            const f = PN.flower($("s5-gflowers"), p[0], p[1], 26, ["#fff1d6", "#ff3d8b", "#19c3e6", "#ff9ec7", "#ffd23f"][i], "#ffd23f");
            gfl.push({ f: f, k: i * 1.7 });
          });
          const lora = $("s5-lora");
          const arcs = [0, 1, 2, 3].map(() => mk(lora, "path", { d: "", opacity: 0 }));
          const beeA = PN.bee($("s5-beeA"), { scale: 1.1 });

          // B: campo de visión, abeja y plaga
          const vf = $("s5-v-field");
          for (let i = 0; i < 8; i++) {
            mk(vf, "line", { x1: 40, y1: 110 + i * 46, x2: 900, y2: 110 + i * 46, stroke: "#17132b", "stroke-width": 3, "stroke-dasharray": "2 22", "stroke-linecap": "round", opacity: 0.4 });
          }
          const vfl = [];
          [[160, 380], [330, 395], [610, 385], [800, 392]].forEach((p, i) => {
            mk($("s5-v-flowers"), "line", { x1: p[0], y1: p[1], x2: p[0], y2: 440, stroke: "#17132b", "stroke-width": 8, "stroke-linecap": "round" });
            vfl.push(PN.flower($("s5-v-flowers"), p[0], p[1], 34, ["#fff1d6", "#ff9ec7", "#19c3e6", "#ff7a2f"][i], "#ffd23f"));
          });
          const beeV = PN.bee($("s5-v-beeholder"), { scale: 1.4 });
          const pest = mk($("s5-v-pestholder"), "g", {});
          mk(pest, "ellipse", { cx: 0, cy: 0, rx: 30, ry: 17, fill: "#6c3df4", stroke: "#17132b", "stroke-width": 5 });
          mk(pest, "circle", { cx: 28, cy: -2, r: 10, fill: "#17132b" });
          [[-14, 14], [0, 15], [14, 14]].forEach((p) => mk(pest, "line", { x1: p[0], y1: p[1], x2: p[0] - 5, y2: p[1] + 12, stroke: "#17132b", "stroke-width": 4, "stroke-linecap": "round" }));
          mk(pest, "line", { x1: 0, y1: -17, x2: 0, y2: 17, stroke: "#17132b", "stroke-width": 3 });

          // B: barras de audio
          const barsG = $("s5-bars");
          const NB = 44;
          const bars = [];
          for (let i = 0; i < NB; i++) {
            const x = 74 + i * 18.2;
            bars.push({ el: mk(barsG, "rect", { x: x, y: 640, width: 11, height: 20, rx: 4, fill: i > 14 && i < 24 ? "#ff3d8b" : "#19c3e6", stroke: "#17132b", "stroke-width": 3 }), i: i });
          }

          // C: mapa de calor
          const COLS = 16, ROWS = 9, CS = 54, X0 = 40, Y0 = 86;
          const heatG = $("s5-heat");
          const cells = [];
          for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
              const edge = Math.min(r, ROWS - 1 - r) / 4;
              let v = 1.05 - 0.95 * Math.pow(c / (COLS - 1), 0.8) + 0.1 * Math.sin(r * 1.7 + c * 0.9) + (1 - edge) * 0.12;
              v = Math.max(0, Math.min(1, v));
              cells.push({ el: mk(heatG, "rect", { x: X0 + c * CS, y: Y0 + r * CS, width: CS - 2, height: CS - 2, fill: heatColor(v), opacity: 0 }), cx: X0 + c * CS + CS / 2, v: v });
            }
          }
          const pinsG = $("s5-pins");
          const pins = [[11, 3], [12, 6]].map((p) => {
            const cx = X0 + p[0] * CS + CS / 2;
            const cy = Y0 + p[1] * CS + CS / 2;
            const outer = mk(pinsG, "g", { transform: "translate(" + cx + " " + cy + ")" });
            const g = mk(outer, "g", {});
            mk(g, "circle", { cx: 0, cy: -34, r: 27, fill: "#17132b", stroke: "#fff1d6", "stroke-width": 5 });
            mk(g, "path", { d: "M -15 -18 L 0 7 L 15 -18 Z", fill: "#17132b" });
            mk(g, "circle", { cx: 0, cy: -34, r: 11, fill: "#ffd23f" });
            return g;
          });
          const pinLabel = mk(pinsG, "g", {});
          mk(pinLabel, "rect", { x: 436, y: 112, width: 280, height: 46, fill: "#17132b" });
          const pt = mk(pinLabel, "text", { x: 452, y: 146, "font-family": "Bangers", "font-size": 38, fill: "#ffd23f", "letter-spacing": 2 });
          pt.textContent = "PRÓXIMA ISLA";
          const popC = PN.sfx($("s5-sfxC"), "¡LISTO!", 800, 360, 150, "#ffd23f", 6);

          const tl = gsap.timeline({ paused: true });

          PN.clock(tl, DUR, function (t) {
            const q = PN.q(t);
            // A
            $("s5-sun-rays").setAttribute("transform", "rotate(" + (q * 14).toFixed(1) + ")");
            blades.forEach((b) => b.el.setAttribute("transform", "rotate(" + (Math.sin(q * 1.5 + b.k) * 5).toFixed(2) + " " + b.x + " 780)"));
            gfl.forEach((g) => g.f.inner.setAttribute("transform", "rotate(" + (Math.sin(q * 1.4 + g.k) * 9).toFixed(2) + ")"));
            const gl = ((q * 0.5) % 2) * 440 - 120;
            $("s5-glint").setAttribute("x", (-180 + Math.max(0, Math.min(310, gl))).toFixed(1));
            $("s5-glint").setAttribute("opacity", gl > -60 && gl < 330 ? 1 : 0);
            $("s5-led").setAttribute("opacity", (Math.sin(q * 6) > 0 ? 1 : 0.25).toFixed(2));
            arcs.forEach((a, k) => {
              if (q < 3.0) {
                a.setAttribute("opacity", 0);
                return;
              }
              const ph = ((((q - 3.0) / 1.8 - k / 4) % 1) + 1) % 1;
              const r = 30 + ph * 120;
              const x1 = 610 + r * Math.cos(-0.75), y1 = 250 + r * Math.sin(-0.75), x2 = 610 + r * Math.cos(0.75), y2 = 250 + r * Math.sin(0.75);
              a.setAttribute("d", "M " + x1.toFixed(1) + " " + y1.toFixed(1) + " A " + r.toFixed(1) + " " + r.toFixed(1) + " 0 0 1 " + x2.toFixed(1) + " " + y2.toFixed(1));
              a.setAttribute("opacity", ((1 - ph) * 0.95).toFixed(2));
            });
            const ax = 920 - ((q * 70) % 1100);
            PN.fly(beeA, ax, 190 + Math.sin(q * 2.2) * 26, -1, Math.cos(q * 2.2) * 0.5, 0.4);
            beeA.flap(t, 0);
            // B
            const bt = q - 8;
            const bx = 470 + 230 * Math.sin(bt * 0.8);
            const by = 220 + 44 * Math.sin(bt * 1.6);
            PN.fly(beeV, bx, by, Math.cos(bt * 0.8) * 230 * 0.8, Math.cos(bt * 1.6) * 44 * 1.6, 0.4);
            beeV.flap(t, 1);
            $("s5-v-box1").setAttribute("transform", "translate(" + bx.toFixed(1) + " " + (by + 4).toFixed(1) + ")");
            const px = 700 + 90 * Math.sin(bt * 0.5);
            pest.setAttribute("transform", "translate(" + px.toFixed(1) + " 352) scale(" + (Math.cos(bt * 0.5) >= 0 ? 1 : -1) + " 1)");
            $("s5-v-box2").setAttribute("transform", "translate(" + px.toFixed(1) + " 352)");
            vfl.forEach((f, i) => f.inner.setAttribute("transform", "rotate(" + (Math.sin(q * 1.2 + i) * 6).toFixed(2) + ")"));
            bars.forEach((b) => {
              const env = 0.35 + 0.65 * Math.abs(Math.sin(bt * 0.8));
              const v = (0.18 + 0.82 * Math.abs(Math.sin(q * 5.1 + b.i * 0.45) * Math.sin(q * 2.3 + b.i * 0.21))) * env;
              const h = 14 + 190 * v;
              b.el.setAttribute("height", h.toFixed(1));
              b.el.setAttribute("y", (650 - h / 2).toFixed(1));
            });
            $("s5-scan").setAttribute("x", (66 + ((q * 130) % 820)).toFixed(1));
            // C
            const sx = X0 + PN.clamp((q - 16.4) / 2.6, 0, 1) * 864;
            $("s5-heat-scan").setAttribute("x", (sx - 3).toFixed(1));
            $("s5-heat-scan").setAttribute("opacity", q > 16.4 && q < 19.2 ? 1 : 0);
            cells.forEach((c) => {
              let o = PN.clamp((sx - c.cx) / 50, 0, 1);
              if (c.v < 0.28 && q > 19.4) o *= 0.88 + 0.12 * Math.sin(q * 5);
              c.el.setAttribute("opacity", o.toFixed(2));
            });
          });

          tl.fromTo("#s5-cam", { scale: 1, transformOrigin: "40% 50%" }, { scale: 1.035, duration: DUR, ease: "sine.inOut" }, 0);
          tl.fromTo("#s5-eyebrow", { opacity: 0, x: -60, rotation: -6 }, { opacity: 1, x: 0, rotation: -1.5, duration: 0.5, ease: "back.out(2)" }, 0.1);
          tl.fromTo("#s5-vis", { opacity: 0, x: -120, rotation: -5 }, { opacity: 1, x: 0, rotation: -0.6, duration: 0.7, ease: "back.out(1.5)" }, 0.1);
          tl.set(["#s5-hb", "#s5-subb", "#s5-hc", "#s5-subc", "#s5-vb", "#s5-vc"], { opacity: 0 }, 0);
          const wordsIn = (arr, at) => tl.fromTo(arr, { opacity: 0, y: 90, rotation: 7 }, { opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: "back.out(1.8)", stagger: 0.09 }, at);
          const subIn = (id, at) => tl.fromTo(id, { opacity: 0, y: 40, rotation: -3 }, { opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: "back.out(1.6)" }, at);

          // BEAT A  0 - 8  el nodo
          wordsIn(heads[0], 0.4);
          subIn("#s5-suba", 1.0);
          tl.fromTo("#s5-pole", { scaleY: 0, svgOrigin: "466 778" }, { scaleY: 1, svgOrigin: "466 778", duration: 0.7, ease: "back.out(1.4)" }, 0.5);
          tl.fromTo("#s5-solar", { opacity: 0, y: -80 }, { opacity: 1, y: 0, duration: 0.6, ease: "back.out(1.8)" }, 1.1);
          tl.fromTo("#s5-cam-node", { opacity: 0, scale: 0.3, svgOrigin: "465 432" }, { opacity: 1, scale: 1, svgOrigin: "465 432", duration: 0.45, ease: "back.out(2.6)" }, 1.7);
          tl.fromTo("#s5-mic", { opacity: 0, scale: 0.3, svgOrigin: "391 552" }, { opacity: 1, scale: 1, svgOrigin: "391 552", duration: 0.45, ease: "back.out(2.6)" }, 2.1);
          tl.fromTo("#s5-clima", { opacity: 0, scale: 0.3, svgOrigin: "563 547" }, { opacity: 1, scale: 1, svgOrigin: "563 547", duration: 0.45, ease: "back.out(2.6)" }, 2.5);
          tl.fromTo("#s5-lora-dot", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.8);
          ["#s5-co1", "#s5-co2", "#s5-co3", "#s5-co4", "#s5-co5"].forEach((id, i) => {
            tl.fromTo(id, { opacity: 0, x: -20, rotation: -3 }, { opacity: 1, x: 0, rotation: 0, duration: 0.4, ease: "back.out(2)" }, 1.4 + i * 0.4);
          });

          // salida A
          tl.to(["#s5-ha", "#s5-suba"], { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, 7.6);
          tl.to("#s5-va", { opacity: 0, duration: 0.4 }, 7.6);

          // BEAT B  8 - 16  ve y escucha
          tl.to("#s5-vis", { backgroundColor: "#fff1d6", duration: 0.1 }, 8.0);
          tl.to("#s5-dot-a", { fill: "#fff1d6", duration: 0.2 }, 8.0);
          tl.to("#s5-dot-b", { fill: "#19c3e6", duration: 0.2 }, 8.0);
          tl.set("#s5-hb", { opacity: 1 }, 8.0);
          wordsIn(heads[1], 8.0);
          subIn("#s5-subb", 8.7);
          tl.fromTo("#s5-vb", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 8.0);
          tl.fromTo("#s5-v-box1", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 9.6);
          tl.fromTo("#s5-v-box2", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 11.0);

          // salida B
          tl.to(["#s5-hb", "#s5-subb"], { opacity: 0, y: -30, duration: 0.4, ease: "power2.in" }, 15.6);
          tl.to("#s5-vb", { opacity: 0, duration: 0.4 }, 15.6);

          // BEAT C  16 - 25  decide
          tl.to("#s5-dot-b", { fill: "#fff1d6", duration: 0.2 }, 16.0);
          tl.to("#s5-dot-c", { fill: "#ffd23f", duration: 0.2 }, 16.0);
          tl.set("#s5-hc", { opacity: 1 }, 16.0);
          wordsIn(heads[2], 16.0);
          subIn("#s5-subc", 16.7);
          tl.fromTo("#s5-vc", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 16.0);
          tl.fromTo("#s5-legend", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 18.8);
          pins.forEach((p, i) => {
            tl.fromTo(p, { y: -220, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "bounce.out" }, 19.8 + i * 0.5);
          });
          tl.fromTo(pinLabel, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "back.out(2)" }, 20.6);
          tl.fromTo("#s5-sfxC", { opacity: 0, scale: 0.2, transformOrigin: "800px 360px" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(3)" }, 20.8);
          tl.to("#s5-sfxC", { opacity: 0, duration: 0.3 }, 22.4);
          tl.fromTo("#s5-chat", { opacity: 0, y: 50, scale: 0.9, transformOrigin: "50% 100%" }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 21.8);

          window.__timelines["s5-tecnologia"] = tl;
        })();
      </script>
    </template>
  </body>
