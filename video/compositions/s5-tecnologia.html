      <script>
        (function () {
          const NS = "http://www.w3.org/2000/svg";
          const mk = (parent, name, attrs) => {
            const el = document.createElementNS(NS, name);
            for (const k in attrs) el.setAttribute(k, attrs[k]);
            parent.appendChild(el);
            return el;
          };
          let seed = 11;
          const rnd = () => {
            seed = (seed * 16807) % 2147483647;
            return (seed - 1) / 2147483646;
          };
          const lerp = (a, b, t) => a + (b - a) * t;
          const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
          const mix = (c1, c2, t) => {
            const a = hex(c1), b = hex(c2);
            return "rgb(" + a.map((v, i) => Math.round(lerp(v, b[i], t))).join(",") + ")";
          };
          const heatColor = (v) => (v < 0.5 ? mix("#bc4749", "#dda15e", v / 0.5) : mix("#dda15e", "#588157", (v - 0.5) / 0.5));

          // barras de audio
          const barsG = document.getElementById("s5-bars");
          const bars = [];
          for (let i = 0; i < 44; i++) {
            const x = 66 + i * 19;
            const r = mk(barsG, "rect", { x: x, y: 560, width: 11, height: 180, rx: 4, fill: i % 7 === 3 ? "#bc4749" : "#588157" });
            bars.push({ el: r, x: x, f: 0.15 + rnd() * 0.85, d: 0.25 + rnd() * 0.35 });
          }

          // mapa de calor
          const COLS = 16, ROWS = 9, CS = 54, X0 = 40, Y0 = 86;
          const heatG = document.getElementById("s5-heat");
          const cells = [];
          for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
              const edge = Math.min(r, ROWS - 1 - r) / 4;
              let v = 1.05 - 0.95 * Math.pow(c / (COLS - 1), 0.8) + 0.1 * Math.sin(r * 1.7 + c * 0.9) + (1 - edge) * 0.12;
              v = Math.max(0, Math.min(1, v));
              cells.push(mk(heatG, "rect", { x: X0 + c * CS, y: Y0 + r * CS, width: CS - 2, height: CS - 2, fill: heatColor(v) }));
            }
          }
          // pines de próxima isla
          const pinsG = document.getElementById("s5-pins");
          const pinAt = [[11, 3], [12, 6]];
          const pins = pinAt.map((p, i) => {
            const cx = X0 + p[0] * CS + CS / 2;
            const cy = Y0 + p[1] * CS + CS / 2;
            const outer = mk(pinsG, "g", { transform: "translate(" + cx + " " + cy + ")" });
            const g = mk(outer, "g", {});
            mk(g, "circle", { cx: 0, cy: -34, r: 26, fill: "#283618", stroke: "#f4ebd0", "stroke-width": 5 });
            mk(g, "path", { d: "M -14 -18 L 0 6 L 14 -18 Z", fill: "#283618" });
            mk(g, "circle", { cx: 0, cy: -34, r: 10, fill: "#a7c957" });
            return g;
          });
          const pinLabel = mk(pinsG, "g", {});
          mk(pinLabel, "rect", { x: 436, y: 112, width: 266, height: 40, fill: "#283618" });
          const pt = mk(pinLabel, "text", { x: 450, y: 140, "font-family": "IBM Plex Mono", "font-weight": "700", "font-size": 26, fill: "#f4ebd0" });
          pt.textContent = "PRÓXIMA ISLA";

          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s5-progress-fill", { scaleX: 0 }, { scaleX: 1, duration: 25, ease: "none" }, 0);
          tl.fromTo("#s5-eyebrow", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.1);
          tl.fromTo("#s5-vis", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 0.1);
          tl.set(["#s5-hb", "#s5-subb", "#s5-hc", "#s5-subc", "#s5-vb", "#s5-vc"], { opacity: 0 }, 0);

          // BEAT A  0 - 8  el nodo
          tl.fromTo("#s5-ha", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.4);
          tl.fromTo("#s5-suba", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 1.0);
          tl.fromTo("#s5-pole", { scaleY: 0, svgOrigin: "465 778" }, { scaleY: 1, svgOrigin: "465 778", duration: 0.8, ease: "power3.out" }, 0.5);
          tl.fromTo("#s5-solar", { opacity: 0, y: -80 }, { opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.6)" }, 1.1);
          tl.fromTo("#s5-cam", { opacity: 0, scale: 0.4, svgOrigin: "465 432" }, { opacity: 1, scale: 1, svgOrigin: "465 432", duration: 0.5, ease: "back.out(2)" }, 1.7);
          tl.fromTo("#s5-mic", { opacity: 0, scale: 0.4, svgOrigin: "391 552" }, { opacity: 1, scale: 1, svgOrigin: "391 552", duration: 0.5, ease: "back.out(2)" }, 2.1);
          tl.fromTo("#s5-clima", { opacity: 0, scale: 0.4, svgOrigin: "563 547" }, { opacity: 1, scale: 1, svgOrigin: "563 547", duration: 0.5, ease: "back.out(2)" }, 2.5);
          tl.fromTo("#s5-lora path", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.25 }, 3.0);
          tl.to("#s5-lora path", { opacity: 0.25, duration: 0.5, yoyo: true, repeat: 5, stagger: 0.18, ease: "sine.inOut" }, 4.0);
          ["#s5-co1", "#s5-co2", "#s5-co3", "#s5-co4", "#s5-co5"].forEach((id, i) => {
            tl.fromTo(id, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 1.4 + i * 0.4);
          });

          // salida A
          tl.to(["#s5-ha", "#s5-suba"], { opacity: 0, y: -30, duration: 0.5, ease: "power2.in" }, 7.5);
          tl.to("#s5-va", { opacity: 0, duration: 0.5 }, 7.5);

          // BEAT B  8 - 16  ve y escucha
          tl.fromTo("#s5-hb", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 8.0);
          tl.fromTo("#s5-subb", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 8.7);
