      <script>
        (function () {
          const mk = PN.mk;
          const DUR = 19;
          const $ = (id) => document.getElementById(id);
          const ins = (id) => Array.from(document.querySelectorAll(id + " .in"));
          const A = ins("#s5-ha"), B = ins("#s5-hb"), Cc = ins("#s5-hc");
          const lerp = (a, b, t) => a + (b - a) * t;
          const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
          const mix = (c1, c2, t) => {
            const a = hex(c1), b = hex(c2);
            return "rgb(" + a.map((v, i) => Math.round(lerp(v, b[i], t))).join(",") + ")";
          };
          // baja → media → alta polinización
          const heat = (v) => (v < 0.5 ? mix("#e6eed4", "#54a36a", v / 0.5) : mix("#54a36a", "#1d5c3e", (v - 0.5) / 0.5));

          const arcs = [0, 1, 2].map(() => mk($("s5-lora"), "path", { d: "", opacity: 0 }));

          // B: campo de visión
          const vfl = [[150, 340], [330, 348], [520, 336], [660, 346]].map((p, i) => {
            mk($("s5-v-flowers"), "line", { x1: p[0], y1: p[1], x2: p[0], y2: 352, stroke: "#2f7d4f", "stroke-width": 4 });
            return PN.flower($("s5-v-flowers"), p[0], p[1], 20, ["#ffffff", "#f5b83d", "#ff7a5c", "#ffffff"][i], "#12301f");
          });
          const beeV = PN.bee($("s5-v-beeholder"), { scale: 1.8 });
          const pest = mk($("s5-v-pestholder"), "g", {});
          mk(pest, "ellipse", { cx: 0, cy: 0, rx: 22, ry: 12, fill: "#5a7564" });
          mk(pest, "circle", { cx: 21, cy: -1, r: 7, fill: "#5a7564" });
          [[-10, 10], [0, 11], [10, 10]].forEach((p) => mk(pest, "line", { x1: p[0], y1: p[1], x2: p[0] - 4, y2: p[1] + 9, stroke: "#5a7564", "stroke-width": 2.5, "stroke-linecap": "round" }));
          const bars = [];
          for (let i = 0; i < 46; i++) bars.push({ el: mk($("s5-bars"), "rect", { x: 80 + i * 14.4, y: 530, width: 7, height: 10, rx: 2, fill: i > 14 && i < 26 ? "#8cc21f" : "#138a5f", opacity: i > 14 && i < 26 ? 1 : 0.55 }), i: i });

          // C: mapa de calor
          const COLS = 16, ROWS = 9, CS = 42, X0 = 64, Y0 = 100;
          const cells = [];
          for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
              const edge = Math.min(r, ROWS - 1 - r) / 4;
              let v = 1.05 - 0.95 * Math.pow(c / (COLS - 1), 0.8) + 0.1 * Math.sin(r * 1.7 + c * 0.9) + (1 - edge) * 0.12;
              v = Math.max(0, Math.min(1, v));
              const x = X0 + c * CS, y = Y0 + r * CS;
              cells.push({ el: mk($("s5-heat"), "rect", { x: x, y: y, width: CS - 2, height: CS - 2, fill: heat(v), opacity: 0 }), cx: x + CS / 2, v: v });
              if (v < 0.3) mk($("s5-dead-over"), "rect", { x: x, y: y, width: CS - 2, height: CS - 2, fill: "url(#s5-hatch)", opacity: 0, class: "dead" });
            }
          }

          const tl = PN.timeline();

          PN.clock(tl, DUR, function (t) {
            arcs.forEach((a, k) => {
              if (t < 3.2) {
                a.setAttribute("opacity", 0);
                return;
              }
              const ph = ((((t - 3.2) / 2.0 - k / 3) % 1) + 1) % 1;
              const r = 26 + ph * 110;
              const x1 = 478 + r * Math.cos(-0.8), y1 = 214 + r * Math.sin(-0.8), x2 = 478 + r * Math.cos(0.5), y2 = 214 + r * Math.sin(0.5);
              a.setAttribute("d", "M " + x1.toFixed(1) + " " + y1.toFixed(1) + " A " + r.toFixed(1) + " " + r.toFixed(1) + " 0 0 1 " + x2.toFixed(1) + " " + y2.toFixed(1));
              a.setAttribute("opacity", ((1 - ph) * 0.9).toFixed(2));
            });
            const bt = t - 4.0;
            const bx = 400 + 230 * Math.sin(bt * 0.75);
            const by = 210 + 36 * Math.sin(bt * 1.5);
            PN.fly(beeV, bx, by, Math.cos(bt * 0.75) * 230 * 0.75, Math.cos(bt * 1.5) * 36 * 1.5, 0.4);
            beeV.flap(t, 1);
            $("s5-v-box1").setAttribute("transform", "translate(" + bx.toFixed(1) + " " + (by + 2).toFixed(1) + ")");
            const px = 560 + 90 * Math.sin(bt * 0.5);
            pest.setAttribute("transform", "translate(" + px.toFixed(1) + " 316) scale(" + (Math.cos(bt * 0.5) >= 0 ? 1 : -1) + " 1)");
            $("s5-v-box2").setAttribute("transform", "translate(" + px.toFixed(1) + " 316)");
            vfl.forEach((f, i) => f.inner.setAttribute("transform", "rotate(" + (Math.sin(t * 1.1 + i) * 5).toFixed(2) + ")"));
            bars.forEach((b) => {
              const env = 0.4 + 0.6 * Math.abs(Math.sin(bt * 0.75));
              const v = (0.15 + 0.85 * Math.abs(Math.sin(t * 5.1 + b.i * 0.45) * Math.sin(t * 2.3 + b.i * 0.21))) * env;
              const h = 10 + 160 * v;
              b.el.setAttribute("height", h.toFixed(1));
              b.el.setAttribute("y", (540 - h / 2).toFixed(1));
            });
            $("s5-scan").setAttribute("x", (76 + ((t * 120) % 650)).toFixed(1));
            const sx = X0 + PN.clamp((t - 8.9) / 2.2, 0, 1) * (COLS * CS);
            $("s5-heat-scan").setAttribute("x", (sx - 1).toFixed(1));
            $("s5-heat-scan").setAttribute("opacity", t > 8.9 && t < 11.2 ? 0.9 : 0);
            cells.forEach((c) => c.el.setAttribute("opacity", PN.clamp((sx - c.cx) / 40, 0, 1).toFixed(2)));
          });

          tl.fromTo("#s5-cam", { scale: 1, transformOrigin: "55% 55%" }, { scale: 1.025, duration: DUR, ease: "sine.inOut" }, 0);
          tl.set([A, B, Cc], { yPercent: 130 }, 0);
          tl.set(["#s5-mka", "#s5-mkb", "#s5-mkc"], { "--mk": 0, color: "#12301f" }, 0);
          tl.set(["#s5-vb", "#s5-vc"], { opacity: 0 }, 0);
          tl.fromTo("#s5-frame", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.3);

          const lineIn = (el, at) => tl.to(el, { yPercent: 0, duration: 0.9, ease: "power3.out" }, at);
          const lineOut = (el, at) => tl.to(el, { yPercent: -130, duration: 0.55, ease: "power3.in" }, at);
          const mark = (id, at) => {
            tl.to(id, { "--mk": 1, duration: 0.6, ease: "power3.out" }, at);
            tl.to(id, { color: "#12301f", duration: 0.01 }, at + 0.3);
          };

          // A  (voz 0,7 a 3,9): el nodo
          lineIn(A[0], 0.8);
          mark("#s5-mka", 1.6);
          tl.fromTo("#s5-pole", { attr: { y2: 620 } }, { attr: { y2: 262 }, duration: 0.9, ease: "power3.out" }, 1.2);
          tl.fromTo("#s5-solar", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 2.0);
          tl.fromTo("#s5-cam-node", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 2.7);
          tl.fromTo("#s5-mic", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 3.1);
          tl.fromTo("#s5-clima", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 3.4);
          tl.fromTo("#s5-lora-dot", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.0);
          [["#s5-co1", 2.1], ["#s5-co2", 2.7], ["#s5-co3", 3.1], ["#s5-co4", 3.4], ["#s5-co5", 3.6]].forEach((c) => tl.fromTo(c[0], { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, c[1]));
          lineOut(A, 3.9);
          tl.set("#s5-ha", { opacity: 0 }, 4.5);
          tl.to("#s5-va", { opacity: 0, duration: 0.5 }, 3.9);

          // B  (voz 4 a 8): visión y bioacústica
          lineIn(B[0], 4.3);
          lineIn(B[1], 4.9);
          mark("#s5-mkb", 5.5);
