      <script>
        (function () {
          const mk = PN.mk;
          const DUR = 9;
          const $ = (id) => document.getElementById(id);
          const ins = Array.from(document.querySelectorAll("#s7-quote .in"));

          // abeja de píxeles vista desde arriba (el mismo logo, dibujado con cuadrados)
          const rows = [
            "...D.....D...",
            "....D...D....",
            "..WW.DDD.WW..",
            ".WWW.EDE.WWW.",
            "WWWWYYYYYWWWW",
            "WWWWDDDDDWWWW",
            ".WWWYYYYYWWW.",
            "..WWDDDDDWW..",
            "....YYYYY....",
            "....DDDDD....",
            ".....YYY.....",
            ".....DDD.....",
            "......D......",
          ];
          const col = { D: "#0a1a13", Y: "#f5b83d", W: "#fbfff0", E: "#c8f25c" };
          const C = 20;
          const pix = [];
          rows.forEach((row, r) => {
            for (let c = 0; c < row.length; c++) {
              const ch = row[c];
              if (col[ch]) pix.push(mk($("s7-pix"), "rect", { x: c * C, y: r * C, width: C - 2, height: C - 2, rx: 2, fill: col[ch], opacity: 0 }));

          });

          const tl = gsap.timeline({ paused: true });
          tl.set(ins, { yPercent: 130 }, 0);
          tl.set("#s7-mk", { "--mk": 0, color: "#eef3e4" }, 0);
          // la frase aparece mientras se dice
          tl.to(ins[0], { yPercent: 0, duration: 0.9, ease: "power3.out" }, 0.6);
          tl.to(ins[1], { yPercent: 0, duration: 0.9, ease: "power3.out" }, 1.4);

          tl.to("#s7-mk", { "--mk": 1, duration: 0.7, ease: "power3.out" }, 4.1);
          tl.to("#s7-mk", { color: "#0a1a13", duration: 0.01 }, 4.45);
          tl.to(ins[3], { yPercent: 0, duration: 0.9, ease: "power3.out" }, 4.45);
          tl.to(ins, { yPercent: -130, duration: 0.6, ease: "power3.in", stagger: 0.06 }, 6.6);

          // el logo: la baldosa y la abeja se arman de a píxeles
          tl.set("#s7-logo", { opacity: 1 }, 7.15);
          tl.fromTo("#s7-tile", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 7.2);
          tl.to(pix, { opacity: 1, duration: 0.3, stagger: { each: 0.012, from: "random" } }, 7.4);
          tl.fromTo("#s7-name", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 7.6);
          tl.fromTo("#s7-sub", { opacity: 0 }, { opacity: 1, duration: 0.7 }, 8.0);
          tl.fromTo("#s7-foot", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 8.1);

          window.__timelines["s7-cierre"] = tl;
        })();
