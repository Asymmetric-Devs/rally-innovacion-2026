<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Montserrat", sans-serif;
        }
        #s1-cam {
          position: absolute;
          inset: 0;
        }
        #s1-title {
          top: 190px;
          width: 840px;
          font-size: 86px;
        }
        #s1-yes {
          position: absolute;
          left: 120px;
          top: 760px;
          font-size: 44px;
          font-weight: 700;
          letter-spacing: -0.02em;
          color: #4f8a0b;
          opacity: 0;
        }
        #s1-frame {
          left: 1000px;
          top: 130px;
          width: 800px;
          height: 820px;
        }
        #s1-map {
          width: 800px;
          height: 820px;
        }
      </style>

      <div data-hf-id="hf-hv3x" id="root" data-composition-id="s1-hook" data-width="1920" data-height="1080">
        <div data-hf-id="hf-d2kf" id="s1-cam">
          <h1 data-hf-id="hf-wood" id="s1-title" class="h">
            <span data-hf-id="hf-smev" class="ln"><span data-hf-id="hf-y3x7" class="in">¿Y si pudiéramos</span></span>
            <span data-hf-id="hf-oupj" class="ln"><span data-hf-id="hf-ultq" class="in">producir más y,</span></span>
            <span data-hf-id="hf-ogei" class="ln"><span data-hf-id="hf-daxq" class="in">al mismo tiempo,</span></span>
            <span data-hf-id="hf-o23h" class="ln"><span data-hf-id="hf-ml5y" class="in">recuperar la</span></span>
            <span data-hf-id="hf-qu8o" class="ln"><span data-hf-id="hf-k88c" class="in"><span data-hf-id="hf-rn88" class="mk" id="s1-mk"><span data-hf-id="hf-sygp">biodiversidad?</span></span></span></span>
          </h1>
          <div data-hf-id="hf-5oro" id="s1-yes">En el Chaco, creemos que sí.</div>

          <div data-hf-id="hf-kgs1" id="s1-frame" class="frame">
            <svg data-hf-id="hf-o7qw" id="s1-map" viewBox="0 0 800 820">
              <defs data-hf-id="hf-mh0t">
                <pattern data-hf-id="hf-w5jv" id="s1-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line data-hf-id="hf-9mk4" x1="0" y1="0" x2="0" y2="12" stroke="#ff7a5c" stroke-width="3" /></pattern>
                <clipPath data-hf-id="hf-12gu" id="s1-lot-clip"><rect data-hf-id="hf-1o7j" x="300" y="150" width="500" height="520" /></clipPath>
                <clipPath data-hf-id="hf-z0w7" id="s1-zone-clip"><ellipse data-hf-id="hf-ja5o" cx="570" cy="410" rx="150" ry="124" /></clipPath>
                <clipPath data-hf-id="hf-j0gy" id="s1-bloom-clip"><ellipse data-hf-id="hf-10wb" id="s1-bloom-e" cx="570" cy="410" rx="0" ry="0" /></clipPath>
              </defs>
              <g data-hf-id="hf-bjo8" id="s1-bands"></g>
              <rect data-hf-id="hf-xz4r" x="300" y="150" width="500" height="520" fill="#e6eed4" />
              <g data-hf-id="hf-89jq" clip-path="url(#s1-lot-clip)"><g data-hf-id="hf-eqqz" id="s1-rows"></g></g>
              <rect data-hf-id="hf-u74h" x="300" y="150" width="500" height="520" fill="none" stroke="#c5d1b1" stroke-width="2" />
              <g data-hf-id="hf-zbhc" clip-path="url(#s1-zone-clip)" id="s1-zone"><rect data-hf-id="hf-ermj" x="300" y="150" width="500" height="520" fill="#e6eed4" /><rect data-hf-id="hf-rn86" x="300" y="150" width="500" height="520" fill="url(#s1-hatch)" opacity="0.85" /></g>
              <ellipse data-hf-id="hf-2qhs" id="s1-zone-ring" cx="570" cy="410" rx="150" ry="124" fill="none" stroke="#ff7a5c" stroke-width="3" stroke-dasharray="10 9" />
              <g data-hf-id="hf-3r6i" clip-path="url(#s1-bloom-clip)"><rect data-hf-id="hf-edbi" x="300" y="150" width="500" height="520" fill="#e6eed4" /><g data-hf-id="hf-eutx" id="s1-bloom"></g></g>
              <g data-hf-id="hf-rs4n" id="s1-trees"></g>
              <g data-hf-id="hf-c6js" id="s1-flowers"></g>
              <g data-hf-id="hf-5e4m" id="s1-trail" fill="#8cc21f"></g>
              <g data-hf-id="hf-7bpf" id="s1-bee-holder"></g>
            </svg>
            <div data-hf-id="hf-rsfg" class="br tl"></div><div data-hf-id="hf-2rei" class="br tr"></div><div data-hf-id="hf-gsq6" class="br bl"></div><div data-hf-id="hf-a3p4" class="br rb"></div>
            <div data-hf-id="hf-cjd0" id="s1-pill" class="pill warn">Lote 01 · sin visitas</div>
            <div data-hf-id="hf-csgz" id="s1-pill2" class="pill" style="opacity:0">Lote 01 · polinización activa</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const mk = PN.mk;
          const DUR = 8;
          const $ = (id) => document.getElementById(id);
          const ins = Array.from(document.querySelectorAll("#s1-title .in"));

          // fondo tipo satélite: franjas de parcelas
          for (let i = 0; i < 11; i++) mk($("s1-bands"), "rect", { x: 0, y: i * 76, width: 800, height: 76, fill: i % 2 ? "#14402a" : "#123524" });
          // cultivo y floración
          PN.rows($("s1-rows"), 322, 176, 790, 660, 36, 30, "#138a5f", 6, 0.3);
          PN.rows($("s1-bloom"), 322, 176, 790, 660, 36, 30, "#8cc21f", 9, 1);

          // monte nativo
          const trees = [[100, 210, 84, 3], [190, 350, 104, 5], [96, 500, 90, 8], [212, 630, 78, 11], [130, 730, 58, 13], [250, 120, 52, 17], [70, 90, 46, 19]].map((t) => PN.tree($("s1-trees"), t[0], t[1], t[2], t[3]));
          const petals = ["#ff7a5c", "#f5b83d", "#ffffff"];
          const flowers = [[262, 230], [286, 470], [160, 110], [276, 700], [60, 640]].map((p, i) => ({ f: PN.flower($("s1-flowers"), p[0], p[1], 15, petals[i % 3], "#12301f"), at: 3.7 + i * 0.18 }));

          // abeja y recorrido
          const path = "M 270 420 C 360 350, 440 470, 520 400 S 560 410, 570 410";
          const pts = PN.samplePath($("s1-map"), path, 80);
          const bee = PN.bee($("s1-bee-holder"), { scale: 1.9 });
          const dots = [];
          for (let i = 0; i < 24; i++) {
            const p = PN.at(pts, i / 23);
            dots.push(mk($("s1-trail"), "circle", { cx: p.x, cy: p.y, r: 3, opacity: 0 }));
          }

          const tl = PN.timeline();

          PN.clock(tl, DUR, function (t) {
            trees.forEach((tr, i) => tr.sway(t + i, 2.4));
            flowers.forEach((f, k) => {
              const u = PN.out((t - f.at) / 0.7);
              f.f.inner.setAttribute("transform", "rotate(" + (Math.sin(t * 1.3 + k) * 6).toFixed(2) + ") scale(" + u.toFixed(3) + ")");
            });
            const u = PN.ease(PN.clamp((t - 1.0) / 4.4, 0, 1));
            const p = PN.at(pts, u);
            bee.place(p.x, p.y + Math.sin(t * 6) * 4, p.ang * 0.5);
            bee.g.setAttribute("opacity", PN.clamp((t - 0.9) / 0.5, 0, 1).toFixed(2));
            bee.flap(t, 0);
            dots.forEach((d, i) => d.setAttribute("opacity", i / 23 <= u && t > 1.0 ? 0.6 : 0));
          });

          tl.fromTo("#s1-cam", { scale: 1, transformOrigin: "60% 50%" }, { scale: 1.025, duration: DUR, ease: "sine.inOut" }, 0);
          tl.fromTo("#s1-frame", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.9, ease: "power3.out" }, 0.1);
          tl.set(ins, { yPercent: 130 }, 0);
          tl.set("#s1-mk", { "--mk": 0, color: "#12301f" }, 0);
          [0.6, 1.5, 2.4, 3.2, 3.8].forEach((at, i) => tl.to(ins[i], { yPercent: 0, duration: 0.9, ease: "power3.out" }, at));
          tl.to("#s1-mk", { "--mk": 1, duration: 0.7, ease: "power3.out" }, 4.4);
          tl.to("#s1-mk", { color: "#12301f", duration: 0.01 }, 4.75);
          tl.fromTo("#s1-yes", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 5.2);

          // "creemos que sí": la zona seca florece
          tl.to("#s1-zone", { opacity: 0, duration: 0.9, ease: "power2.out" }, 5.5);
          tl.to("#s1-zone-ring", { opacity: 0, duration: 0.6 }, 5.5);
          tl.to("#s1-bloom-e", { attr: { rx: 150, ry: 124 }, duration: 1.2, ease: "power2.out" }, 5.5);
          tl.to("#s1-pill", { opacity: 0, duration: 0.3 }, 5.7);
          tl.to("#s1-pill2", { opacity: 1, duration: 0.5 }, 6.0);

          window.__timelines["s1-hook"] = PN.raw(tl);
        })();
      </script>
    </template>
  </body>
</html>
