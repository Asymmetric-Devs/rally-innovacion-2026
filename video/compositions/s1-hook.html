      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const trail = document.getElementById("s1-trail");
          const len = trail.getTotalLength();
          const pts = [];
          for (let i = 0; i <= 40; i++) {
            const p = trail.getPointAtLength((len * i) / 40);
            pts.push({ x: p.x, y: p.y });
          }
          const bee = { t: 0 };
          const beeEl = document.getElementById("s1-bee");
          const place = () => {
            const f = bee.t * 40;
            const i = Math.min(39, Math.floor(f));
            const a = pts[i];
            const b = pts[i + 1];
            const k = f - i;
            const x = a.x + (b.x - a.x) * k;
            const y = a.y + (b.y - a.y) * k + Math.sin(bee.t * 38) * 7;
            beeEl.setAttribute("transform", "translate(" + x + " " + y + ") scale(-1 1)");
          };
          place();

          tl.set("#s1-trail", { strokeDasharray: "4 14" }, 0);
          tl.fromTo("#s1-tag", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 0.1);
          tl.fromTo("#s1-lot", { opacity: 0, scale: 0.94, transformOrigin: "1160px 420px" }, { opacity: 1, scale: 1, duration: 1.1, ease: "power2.out" }, 0.2);
          tl.fromTo("#s1-monte", { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 1.0, ease: "power3.out" }, 0.4);
          tl.fromTo("#s1-bee", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.2);
          tl.to(bee, { t: 1, duration: 3.6, ease: "sine.inOut", onUpdate: place }, 1.3);
          tl.to("#s1-bee", { opacity: 0, duration: 0.6, ease: "power1.in" }, 4.7);
          tl.fromTo("#s1-dead", { opacity: 0, scale: 0.4, transformOrigin: "1180px 420px" }, { opacity: 0.55, scale: 1, duration: 0.9, ease: "back.out(1.6)" }, 4.9);
          tl.fromTo("#s1-dead-ring", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 5.0);
          tl.fromTo("#s1-q", { opacity: 0, scale: 0.5, transformOrigin: "1180px 420px" }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(2)" }, 5.4);
          tl.fromTo("#s1-zone-label", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 5.7);
          tl.to("#s1-dead", { scale: 1.08, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 2, transformOrigin: "1180px 420px" }, 6.0);
          tl.fromTo("#s1-title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 6.6);
          window.__timelines["s1-hook"] = tl;
        })();
