<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Instrument Serif";
          font-style: normal;
          src: url("assets/fonts/InstrumentSerif-Regular.woff2") format("woff2");
        }
        @font-face {
          font-family: "Instrument Serif";
          font-style: italic;
          src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2");
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #f4efe6;
          font-family: "Instrument Serif", serif;
          color: #1d1b19;
        }
        #s1-cam {
          position: absolute;
          inset: 0;
        }
        #s1-title {
          position: absolute;
          left: 120px;
          top: 120px;
          font-size: 128px;
          line-height: 1.02;
          letter-spacing: -0.015em;
          font-weight: 400;
        }
        #s1-title .ln {
          display: block;
          overflow: hidden;
          padding-bottom: 0.14em;
          margin-bottom: -0.14em;
        }
        #s1-title .in {
          display: block;
        }
        #s1-title .yes {
          font-style: italic;
          color: #c4502f;
          margin-top: 0.12em;
        }
        #s1-strip {
          position: absolute;
          left: 120px;
          top: 742px;
          width: 1680px;
          height: 260px;
        }
      </style>

      <div id="root" data-composition-id="s1-hook" data-width="1920" data-height="1080">
        <div id="s1-cam">
          <h1 id="s1-title">
            <span class="ln"><span class="in">¿Y si pudiéramos producir más</span></span>
            <span class="ln"><span class="in">y, al mismo tiempo, recuperar</span></span>
            <span class="ln"><span class="in">la biodiversidad?</span></span>
            <span class="ln yes"><span class="in">En el Chaco, creemos que sí.</span></span>
          </h1>

          <svg id="s1-strip" viewBox="0 0 1680 260">
            <defs>
              <clipPath id="s1-lot-clip"><rect x="300" y="0" width="1380" height="260" /></clipPath>
              <clipPath id="s1-zone-clip"><ellipse id="s1-zone-e" cx="1130" cy="130" rx="175" ry="104" /></clipPath>
              <clipPath id="s1-bloom-clip"><ellipse id="s1-bloom-e" cx="1130" cy="130" rx="0" ry="0" /></clipPath>
            </defs>
            <g id="s1-lot">
              <rect x="300" y="0" width="1380" height="260" fill="#ebe4d6" />
              <g clip-path="url(#s1-lot-clip)"><g id="s1-rows"></g></g>
              <g clip-path="url(#s1-zone-clip)" id="s1-zone">
                <rect x="300" y="0" width="1380" height="260" fill="#ebe4d6" />
                <rect x="300" y="0" width="1380" height="260" fill="url(#hatch-clay)" opacity="0.8" />
              </g>
              <ellipse id="s1-zone-ring" cx="1130" cy="130" rx="175" ry="104" fill="none" stroke="#c4502f" stroke-width="3" stroke-dasharray="10 9" />
              <g clip-path="url(#s1-bloom-clip)"><rect x="300" y="0" width="1380" height="260" fill="#ebe4d6" /><g id="s1-bloom"></g></g>
            </g>
            <g id="s1-trees"></g>
            <g id="s1-flowers"></g>
            <g id="s1-trail" fill="#1d1b19"></g>
            <g id="s1-bee-holder"></g>
          </svg>
        </div>
      </div>

      <script>
        (function () {
          const mk = PN.mk;
          const DUR = 8;
          const $ = (id) => document.getElementById(id);
          const ins = Array.from(document.querySelectorAll("#s1-title .in"));

          // cultivo (puntos tenues) y floración que va a ocupar la zona seca
          PN.rows($("s1-rows"), 320, 30, 1660, 240, 36, 30, "#1d1b19", 6, 0.28);
          PN.rows($("s1-bloom"), 320, 30, 1660, 240, 36, 30, "#e5a02d", 8, 1);

          // monte nativo
          const trees = [[110, 132, 78, 3], [208, 62, 54, 5], [212, 196, 58, 8], [48, 48, 40, 11], [74, 218, 32, 13]].map((t) => PN.tree($("s1-trees"), t[0], t[1], t[2], t[3]));
          const petals = ["#c4502f", "#e5a02d", "#f4efe6"];
          const flowers = [[44, 120], [262, 122], [120, 44], [268, 238], [60, 226]].map((p, i) => ({ f: PN.flower($("s1-flowers"), p[0], p[1], 15, petals[i % 3], "#1d1b19"), at: 3.7 + i * 0.18 }));

          // abeja
          const path = "M 280 150 C 460 80, 640 190, 840 120 S 1040 150, 1130 130";
          const pts = PN.samplePath($("s1-strip"), path, 80);
          const bee = PN.bee($("s1-bee-holder"), { scale: 1.9 });
          const trailG = $("s1-trail");
          const TN = 26;
          const dots = [];
          for (let i = 0; i < TN; i++) {
            const p = PN.at(pts, i / (TN - 1));
            dots.push(mk(trailG, "circle", { cx: p.x, cy: p.y, r: 2.8, opacity: 0 }));
          }

          const tl = gsap.timeline({ paused: true });

          PN.clock(tl, DUR, function (t) {
            trees.forEach((tr, i) => tr.sway(t + i, 2.4));
            flowers.forEach((f, k) => {
              const u = PN.out((t - f.at) / 0.7);
              f.f.inner.setAttribute("transform", "rotate(" + (Math.sin(t * 1.3 + k) * 6).toFixed(2) + ") scale(" + u.toFixed(3) + ")");
            });
            const u = PN.ease(PN.clamp((t - 1.0) / 4.4, 0, 1));
            const p = PN.at(pts, u);
            const op = PN.clamp((t - 0.9) / 0.5, 0, 1);
            bee.place(p.x, p.y + Math.sin(t * 6) * 4, p.ang * 0.5);
            bee.g.setAttribute("opacity", op.toFixed(2));
            bee.flap(t, 0);
            dots.forEach((d, i) => d.setAttribute("opacity", i / (TN - 1) <= u && t > 1.0 ? 0.55 : 0));
          });

          tl.fromTo("#s1-cam", { scale: 1, transformOrigin: "50% 60%" }, { scale: 1.03, duration: DUR, ease: "sine.inOut" }, 0);
          tl.fromTo("#s1-strip", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.1);
          const line = (i, at) => tl.to(ins[i], { y: 0, yPercent: 0, duration: 0.9, ease: "power3.out" }, at);
          tl.set(ins, { yPercent: 128 }, 0);
          line(0, 0.6);
          line(1, 2.5);
          line(2, 3.7);
          line(3, 5.2);

          // "creemos que sí": la zona seca florece
          tl.to("#s1-zone", { opacity: 0, duration: 0.9, ease: "power2.out" }, 5.5);
          tl.to("#s1-zone-ring", { opacity: 0, duration: 0.6 }, 5.5);
          tl.to("#s1-bloom-e", { attr: { rx: 175, ry: 104 }, duration: 1.2, ease: "power2.out" }, 5.5);

          window.__timelines["s1-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
