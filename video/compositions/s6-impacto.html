<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Instrument Serif";
          font-style: normal;
          src: url("assets/fonts/InstrumentSerif-Regular.woff2") format("woff2");
        }
        @font-face {
          font-family: "Instrument Serif";
          font-style: italic;
          src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2");
        }
        @font-face {
          font-family: "Instrument Sans";
          font-weight: 400 700;
          src: url("assets/fonts/InstrumentSans.woff2") format("woff2");
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #f4efe6;
          font-family: "Instrument Serif", serif;
          color: #1d1b19;
        }
        #s6-cam {
          position: absolute;
          inset: 0;
        }
        #s6-list {
          position: absolute;
          left: 120px;
          top: 200px;
          width: 960px;
        }
        .item {
          position: relative;
          height: 168px;
          border-top: 2px solid rgba(29, 27, 25, 0.22);
          overflow: hidden;
        }
        .item .num {
          position: absolute;
          left: 0;
          top: 34px;
          font-family: "Instrument Sans", sans-serif;
          font-weight: 600;
          font-size: 22px;
          letter-spacing: 0.16em;
          color: #c4502f;
        }
        .item .txt {
          position: absolute;
          left: 84px;
          top: 6px;
          font-size: 112px;
          line-height: 1.12;
          letter-spacing: -0.015em;
          white-space: nowrap;
        }
        .item .txt em {
          color: #c4502f;
        }
        #s6-map {
          position: absolute;
          left: 1130px;
          top: 230px;
          width: 700px;
          height: 640px;
        }
        #s6-end {
          position: absolute;
          left: 120px;
          top: 290px;
          width: 980px;
          font-size: 124px;
          line-height: 1.02;
          letter-spacing: -0.02em;
        }
        #s6-end .ln {
          display: block;
          overflow: hidden;
          padding-bottom: 0.14em;
          margin-bottom: -0.14em;
        }
        #s6-end .in {
          display: block;
        }
        #s6-end em {
          color: #c4502f;
        }
      </style>

      <div id="root" data-composition-id="s6-impacto" data-width="1920" data-height="1080">
        <div id="s6-cam">
          <div id="s6-list">
            <div class="item" id="s6-i1"><span class="num">01</span><span class="txt">Menos fertilizante</span></div>
            <div class="item" id="s6-i2"><span class="num">02</span><span class="txt">Cero pesticidas</span></div>
            <div class="item" id="s6-i3"><span class="num">03</span><span class="txt">Más biodiversidad</span></div>
            <div class="item" id="s6-i4"><span class="num">04</span><span class="txt">Mejor <em>precio</em></span></div>
          </div>
          <h2 id="s6-end"><span class="ln"><span class="in">Pensada para el</span></span><span class="ln"><span class="in">productor chaqueño.</span></span><span class="ln"><span class="in"><em>Escalable a toda</em></span></span><span class="ln"><span class="in"><em>la región.</em></span></span></h2>
          <svg id="s6-map" viewBox="0 0 700 640"></svg>
        </div>
      </div>

      <script>
        (function () {
          const mk = PN.mk;
          const DUR = 12.5;
          const $ = (id) => document.getElementById(id);

          // mapa de puntos; los núcleos se encienden con cada beneficio y luego se expanden a toda la región
          const COLS = 22, ROWS = 20, GAP = 31;
          const dots = [];
          for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
              const x = 18 + c * GAP, y = 18 + r * GAP;
              dots.push({ el: mk($("s6-map"), "circle", { cx: x, cy: y, r: 3, fill: "#1d1b19", opacity: 0.2 }), x: x, y: y });
            }
          }
          const nuclei = [{ x: 150, y: 150, at: 1.3 }, { x: 450, y: 110, at: 2.7 }, { x: 250, y: 380, at: 3.9 }, { x: 540, y: 470, at: 5.4 }];

          const items = ["#s6-i1", "#s6-i2", "#s6-i3", "#s6-i4"];
          const endIns = Array.from(document.querySelectorAll("#s6-end .in"));

          const tl = gsap.timeline({ paused: true });

          PN.clock(tl, DUR, function (t) {
            const wave = PN.clamp((t - 8.9) / 2.6, 0, 1);
            dots.forEach((d) => {
              let lvl = 0;
              nuclei.forEach((n) => {
                const dist = Math.hypot(d.x - n.x, d.y - n.y);
                const grow = PN.out((t - n.at) / 1.4);
                const radius = 105 * grow + 760 * PN.out(wave);
                const l = PN.clamp(1 - dist / Math.max(radius, 1), 0, 1);
                lvl = Math.max(lvl, t > n.at ? PN.clamp(l * 1.6, 0, 1) : 0);
              });
              d.el.setAttribute("r", (3 + 4.5 * lvl).toFixed(2));
              d.el.setAttribute("fill", lvl > 0.02 ? "#e5a02d" : "#1d1b19");
              d.el.setAttribute("opacity", (0.2 + 0.8 * lvl).toFixed(2));
            });
          });

          tl.fromTo("#s6-cam", { scale: 1, transformOrigin: "50% 55%" }, { scale: 1.02, duration: DUR, ease: "sine.inOut" }, 0);
          tl.fromTo("#s6-map", { opacity: 0 }, { opacity: 1, duration: 0.9 }, 0.5);
          [1.1, 2.3, 3.6, 5.3].forEach((at, i) => {
            tl.fromTo(items[i] + " .txt", { yPercent: 170 }, { yPercent: 0, duration: 0.9, ease: "power3.out" }, at);
            tl.fromTo(items[i] + " .num", { opacity: 0 }, { opacity: 1, duration: 0.5 }, at + 0.2);
            tl.fromTo(items[i], { borderTopColor: "rgba(29,27,25,0)" }, { borderTopColor: "rgba(29,27,25,0.22)", duration: 0.6 }, at);
          });

          // segunda frase: pasa a un titular grande y el mapa se expande
          tl.to("#s6-list", { opacity: 0, y: -30, duration: 0.6, ease: "power2.in" }, 6.9);
          tl.set(endIns, { yPercent: 128 }, 0);
          tl.set("#s6-end", { opacity: 0 }, 0);
          tl.set("#s6-end", { opacity: 1 }, 7.2);
          tl.to(endIns[0], { yPercent: 0, duration: 0.9, ease: "power3.out" }, 7.3);
          tl.to(endIns[1], { yPercent: 0, duration: 0.9, ease: "power3.out" }, 8.0);
          tl.to(endIns[2], { yPercent: 0, duration: 0.9, ease: "power3.out" }, 9.0);
          tl.to(endIns[3], { yPercent: 0, duration: 0.9, ease: "power3.out" }, 9.7);

          window.__timelines["s6-impacto"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
