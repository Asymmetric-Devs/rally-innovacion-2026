      <div data-hf-id="hf-vauf" id="root" data-composition-id="s2-problema" data-width="1920" data-height="1080">
        <div data-hf-id="hf-ykmb" id="s2-eyebrow">01 · EL PROBLEMA</div>

        <h2 data-hf-id="hf-3n65" id="s2-ha" class="s2-h">Lo orgánico se vende <span data-hf-id="hf-45gy" class="hl">mejor</span>.</h2>
        <p data-hf-id="hf-mlpc" id="s2-suba" class="s2-sub">Sin agroquímicos y sin semillas transgénicas, el producto del Chaco llega a mercados que pagan un precio premium.</p>

        <h2 data-hf-id="hf-zsox" id="s2-hb" class="s2-h">Pero hay <span data-hf-id="hf-hx1b" class="hl">dos muros</span>.</h2>
        <p data-hf-id="hf-bkb9" id="s2-subb" class="s2-sub">Suelos agotados y polinización incierta. Sin insumos químicos, nada compensa cuando la naturaleza falla.</p>

        <h2 data-hf-id="hf-jjnl" id="s2-hc" class="s2-h">Y nadie sabe <span data-hf-id="hf-oxeh" class="hl">dónde falla</span>.</h2>
        <p data-hf-id="hf-8u4c" id="s2-subc" class="s2-sub">Si los insectos no llegan al centro del lote, el rinde se resiente. Hoy el productor lo descubre recién en la cosecha.</p>

        <div data-hf-id="hf-1o1e" id="s2-progress"><div data-hf-id="hf-rpjg" id="s2-progress-fill"></div></div>

                <text data-hf-id="hf-qkvr" x="-190" y="-52" font-family="Archivo Black" font-size="54" fill="#283618">ORGÁNICO</text>
                <text data-hf-id="hf-v54a" x="-190" y="60" font-family="Archivo Black" font-size="70" fill="#f4ebd0" stroke="#283618" stroke-width="3">PREMIUM</text>
                <path data-hf-id="hf-0k7w" d="M -190 105 C -150 70, -110 70, -70 105 C -110 140, -150 140, -190 105 Z" fill="#588157" stroke="#283618" stroke-width="4" />
              </g>
            </g>
            <path data-hf-id="hf-ggko" d="M 415 290 C 420 200, 380 150, 415 70" fill="none" stroke="#283618" stroke-width="5" stroke-dasharray="4 12" stroke-linecap="round" />

          <!-- B: dos muros -->
          <svg data-hf-id="hf-whcb" id="s2-vb" viewBox="0 0 830 900">

            <g data-hf-id="hf-dgds" id="s2-wall-r"></g>
            <rect data-hf-id="hf-jbf9" x="60" y="760" width="710" height="12" fill="#283618" />
            <text data-hf-id="hf-ve77" x="215" y="816" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="28" fill="#283618">SUELOS AGOTADOS</text>
            <text data-hf-id="hf-rrrx" x="615" y="816" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="28" fill="#283618">POLINIZACIÓN</text>
            <text data-hf-id="hf-36ri" x="615" y="850" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="28" fill="#bc4749">INCIERTA</text>
            <g data-hf-id="hf-ie6w" transform="translate(415 690)"><g data-hf-id="hf-lle8" id="s2-farmer">
              <circle data-hf-id="hf-lsee" cx="0" cy="-60" r="20" fill="#283618" />

            </g></g>

          <!-- C: lote con zona muerta -->
          <svg data-hf-id="hf-4osa" id="s2-vc" viewBox="0 0 830 900">
            <rect data-hf-id="hf-f983" x="60" y="150" width="710" height="600" rx="8" fill="#a3b18a" stroke="#283618" stroke-width="5" />
            <g data-hf-id="hf-5rur" id="s2-vc-rows" fill="#8fa876"></g>
            <g data-hf-id="hf-zuy3" id="s2-vc-edge" fill="#588157">

              <rect data-hf-id="hf-r72d" x="650" y="150" width="120" height="600" opacity="0.85" />

              <rect data-hf-id="hf-tppn" x="60" y="640" width="710" height="110" opacity="0.85" />
            </g>
            <ellipse data-hf-id="hf-lnov" id="s2-vc-dead" cx="415" cy="450" rx="190" ry="150" fill="#bc4749" opacity="0.6" />
            <ellipse data-hf-id="hf-tr89" id="s2-vc-ring" cx="415" cy="450" rx="190" ry="150" fill="none" stroke="#bc4749" stroke-width="6" stroke-dasharray="14 12" />
            <text data-hf-id="hf-8nrj" id="s2-vc-q" x="415" y="505" text-anchor="middle" font-family="Archivo Black" font-size="170" fill="#f4ebd0">?</text>
            <text data-hf-id="hf-di9c" x="415" y="810" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="28" fill="#bc4749" letter-spacing="3">CENTRO DEL LOTE SIN DATOS</text>
          </svg>

      <script>
        (function () {
          const NS = "http://www.w3.org/2000/svg";
          const mk = (parent, name, attrs) => {
            const el = document.createElementNS(NS, name);
            for (const k in attrs) el.setAttribute(k, attrs[k]);
            parent.appendChild(el);
            return el;
          };

          // muros de ladrillos
          const buildWall = (id, x0, rows, dim) => {
            const g = document.getElementById(id);
            const bricks = [];
            for (let r = 0; r < rows; r++) {
              const off = r % 2 ? 0 : 0;
              for (let c = 0; c < 3; c++) {
                const bw = 112;
                const shift = r % 2 ? -bw / 2 : 0;
                const x = x0 + c * bw + shift;
                if (x < x0 - 1 && c === 0) continue;
                const b = mk(g, "rect", {
                  x: x, y: 760 - (r + 1) * 70, width: bw - 6, height: 64, rx: 4,
                  fill: dim, stroke: "#283618", "stroke-width": 4,
                });
                bricks.push(b);
              }
            }
            return bricks;
          };
          const wallL = buildWall("s2-wall-l", 60, 6, "#a98467");
          const wallR = buildWall("s2-wall-r", 460, 7, "#bc4749");

          // surcos del lote C
          const rowsG = document.getElementById("s2-vc-rows");
          for (let i = 0; i < 11; i++) {
            mk(rowsG, "rect", { x: 60, y: 150 + i * 56, width: 710, height: 26 });
          }

          const tl = gsap.timeline({ paused: true });

          // progreso
          tl.fromTo("#s2-progress-fill", { scaleX: 0 }, { scaleX: 1, duration: 20, ease: "none" }, 0);
          tl.fromTo("#s2-eyebrow", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.1);

          // estado inicial de B y C
          tl.set(["#s2-hb", "#s2-subb", "#s2-hc", "#s2-subc", "#s2-vb", "#s2-vc"], { opacity: 0 }, 0);

          // BEAT A  0 - 6.5
          tl.fromTo("#s2-ha", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.3);
          tl.fromTo("#s2-suba", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 1.0);
          tl.fromTo("#s2-tag-in", { rotation: -40, scale: 0.4, opacity: 0, svgOrigin: "0 0" }, { rotation: -8, scale: 1, opacity: 1, svgOrigin: "0 0", duration: 1.1, ease: "back.out(1.7)" }, 0.5);
          tl.to("#s2-tag-in", { rotation: 4, duration: 1.8, ease: "sine.inOut", svgOrigin: "0 0", yoyo: true, repeat: 1 }, 1.8);

          // salida A
          tl.to(["#s2-ha", "#s2-suba"], { opacity: 0, y: -30, duration: 0.5, ease: "power2.in" }, 6.0);
          tl.to("#s2-va", { opacity: 0, scale: 0.9, transformOrigin: "50% 50%", duration: 0.5, ease: "power2.in" }, 6.0);

          // BEAT B  6.5 - 13.5
          tl.fromTo("#s2-hb", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 6.5);
          tl.fromTo("#s2-subb", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 7.2);
          tl.set("#s2-vb", { opacity: 1 }, 6.5);
          wallL.forEach((b, i) => {
            tl.fromTo(b, { y: -700, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "bounce.out" }, 6.7 + i * 0.16);
          });
          wallR.forEach((b, i) => {
            tl.fromTo(b, { y: -700, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "bounce.out" }, 7.2 + i * 0.16);
          });
          tl.fromTo("#s2-farmer", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 9.0);

          // salida B
          tl.to(["#s2-hb", "#s2-subb"], { opacity: 0, y: -30, duration: 0.5, ease: "power2.in" }, 13.0);
          tl.to("#s2-vb", { opacity: 0, duration: 0.5 }, 13.0);

          // BEAT C  13.5 - 20
          tl.fromTo("#s2-hc", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 13.5);
          tl.fromTo("#s2-subc", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 14.2);
          tl.set("#s2-vc", { opacity: 1 }, 13.5);
          tl.fromTo("#s2-vc", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 13.5);
          tl.fromTo("#s2-vc-dead", { opacity: 0, scale: 0.3, svgOrigin: "415 450" }, { opacity: 0.6, scale: 1, svgOrigin: "415 450", duration: 1.0, ease: "back.out(1.6)" }, 14.3);
          tl.fromTo("#s2-vc-q", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 15.0);
          tl.to("#s2-vc-dead", { opacity: 0.85, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 3 }, 15.4);

          window.__timelines["s2-problema"] = tl;
        })();
      </script>
