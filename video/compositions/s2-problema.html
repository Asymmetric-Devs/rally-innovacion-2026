<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Instrument Serif";
          font-style: normal;
          src: url("assets/fonts/InstrumentSerif-Regular.woff2") format("woff2");
        }
        @font-face {
          font-family: "Instrument Serif";
          font-style: italic;
          src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2");
        }
        @font-face {
          font-family: "Instrument Sans";
          font-weight: 400 700;
          src: url("assets/fonts/InstrumentSans.woff2") format("woff2");
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #f4efe6;
          font-family: "Instrument Serif", serif;
          color: #1d1b19;
        }
        #s2-cam {
          position: absolute;
          inset: 0;
        }
        .h {
          position: absolute;
          left: 120px;
          top: 340px;
          width: 800px;
          font-size: 132px;
          line-height: 1.02;
          letter-spacing: -0.015em;
          font-weight: 400;
        }
        .h .ln {
          display: block;
          overflow: hidden;
          padding-bottom: 0.14em;
          margin-bottom: -0.14em;
        }
        .h .in {
          display: block;
        }
        .h em {
          color: #c4502f;
        }
        #s2-panel {
          position: absolute;
          left: 1000px;
          top: 180px;
          width: 800px;
          height: 720px;
          background: #ebe4d6;
        }
        #s2-panel svg {
          position: absolute;
          left: 0;
          top: 0;
          width: 800px;
          height: 720px;
        }
        .cap {
          font-family: "Instrument Sans", sans-serif;
          font-weight: 600;
          font-size: 21px;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          fill: #1d1b19;
        }
      </style>

      <div id="root" data-composition-id="s2-problema" data-width="1920" data-height="1080">
        <div id="s2-cam">
          <h2 id="s2-ha" class="h"><span class="ln"><span class="in">Lo orgánico</span></span><span class="ln"><span class="in">vale <em>más.</em></span></span></h2>
          <h2 id="s2-hb" class="h"><span class="ln"><span class="in">Pero hay</span></span><span class="ln"><span class="in"><em>dos muros.</em></span></span></h2>
          <h2 id="s2-hc" class="h"><span class="ln"><span class="in">Y nadie sabe</span></span><span class="ln"><span class="in">dónde <em>falla.</em></span></span></h2>

          <div id="s2-panel">
            <!-- A: etiqueta -->
            <svg id="s2-va" viewBox="0 0 800 720">
              <g id="s2-pend">
                <line x1="400" y1="-20" x2="400" y2="196" stroke="#1d1b19" stroke-width="3" />
                <path d="M 320 196 L 480 196 L 556 254 L 556 600 L 244 600 L 244 254 Z" fill="#f4efe6" stroke="#1d1b19" stroke-width="3" stroke-linejoin="round" />
                <circle cx="400" cy="232" r="13" fill="#c4502f" />
                <text x="400" y="372" text-anchor="middle" font-family="Instrument Serif" font-style="italic" font-size="78" fill="#1d1b19">Orgánico</text>
                <rect x="372" y="400" width="56" height="4" fill="#c4502f" />
                <text class="cap" x="400" y="454" text-anchor="middle">Precio</text>
                <text class="cap" x="400" y="486" text-anchor="middle">premium</text>
              </g>
            </svg>

            <!-- B: dos muros -->
            <svg id="s2-vb" viewBox="0 0 800 720">
              <rect x="120" y="600" width="560" height="3" fill="#1d1b19" />
              <rect id="s2-slabL" x="170" y="190" width="170" height="410" fill="#1d1b19" />
              <rect id="s2-slabR" x="460" y="150" width="170" height="450" fill="#c4502f" />
              <text id="s2-lblL" class="cap" x="255" y="646" text-anchor="middle">Suelos</text>
              <text id="s2-lblL2" class="cap" x="255" y="674" text-anchor="middle">agotados</text>
              <text id="s2-lblR" class="cap" x="545" y="646" text-anchor="middle">Polinización</text>
              <text id="s2-lblR2" class="cap" x="545" y="674" text-anchor="middle">incierta</text>
            </svg>

            <!-- C: lote -->
            <svg id="s2-vc" viewBox="0 0 800 720">
              <defs>
                <clipPath id="s2-lot-clip"><rect x="60" y="120" width="680" height="440" /></clipPath>
                <clipPath id="s2-zone-clip"><ellipse cx="400" cy="340" rx="150" ry="120" /></clipPath>
              </defs>
              <rect x="60" y="120" width="680" height="440" fill="#f4efe6" />
              <g clip-path="url(#s2-lot-clip)"><g id="s2-rows"></g></g>
              <g clip-path="url(#s2-zone-clip)" id="s2-zone"><rect x="60" y="120" width="680" height="440" fill="#f4efe6" /><rect x="60" y="120" width="680" height="440" fill="url(#hatch-clay)" opacity="0.8" /></g>
              <ellipse id="s2-zone-ring" cx="400" cy="340" rx="150" ry="120" fill="none" stroke="#c4502f" stroke-width="3" stroke-dasharray="10 9" />
              <text id="s2-q" x="400" y="372" text-anchor="middle" font-family="Instrument Serif" font-style="italic" font-size="120" fill="#c4502f">?</text>
              <g id="s2-bees"></g>
              <text id="s2-lblC" class="cap" x="400" y="616" text-anchor="middle">Centro del lote: sin datos</text>
            </svg>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const DUR = 18;
          const $ = (id) => document.getElementById(id);
          const ins = (id) => Array.from(document.querySelectorAll(id + " .in"));
          const A = ins("#s2-ha"), B = ins("#s2-hb"), Cc = ins("#s2-hc");

          PN.rows($("s2-rows"), 80, 150, 730, 540, 38, 32, "#1d1b19", 7, 0.28);

          // abejas que se acercan al lote y se detienen antes del centro
          const flows = [0, 1, 2].map((k) => {
            const y0 = 230 + k * 110;
            const d = "M 40 " + (y0 + 10) + " C 130 " + (y0 - 40) + ", 200 " + (y0 + 40) + ", 300 " + y0;
            return { pts: PN.samplePath($("s2-vc"), d, 50), bee: PN.bee($("s2-bees"), { scale: 1.3 }), k: k };
          });

          const tl = gsap.timeline({ paused: true });

          PN.clock(tl, DUR, function (t) {
            // A: la etiqueta se mece
            const dt = Math.max(0, t - 1.1);
            $("s2-pend").setAttribute("transform", "rotate(" + (t < 1.1 ? 0 : 8 * Math.exp(-0.3 * dt) * Math.sin(dt * 2.7)).toFixed(2) + " 400 -20)");
            // C: abejas
            flows.forEach((f) => {
              const raw = (t - 11.0 - f.k * 0.9) / 3.2;
              if (raw < 0) {
                f.bee.g.setAttribute("opacity", 0);
                return;
              }
              const u = raw - Math.floor(raw);
              const p = PN.at(f.pts, PN.ease(u));
              f.bee.place(p.x, p.y + Math.sin(t * 7 + f.k) * 3, p.ang * 0.5);
              f.bee.g.setAttribute("opacity", (PN.clamp(u / 0.12, 0, 1) * (1 - PN.clamp((u - 0.72) / 0.24, 0, 1))).toFixed(2));
              f.bee.flap(t, f.k);
            });
          });

          tl.fromTo("#s2-cam", { scale: 1, transformOrigin: "50% 55%" }, { scale: 1.025, duration: DUR, ease: "sine.inOut" }, 0);
          tl.set([A, B, Cc], { yPercent: 128 }, 0);
          tl.set(["#s2-vb", "#s2-vc"], { opacity: 0 }, 0);
          tl.fromTo("#s2-panel", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.3);

          const lineIn = (el, at) => tl.to(el, { yPercent: 0, duration: 0.9, ease: "power3.out" }, at);
          const lineOut = (el, at) => tl.to(el, { yPercent: -128, duration: 0.55, ease: "power3.in" }, at);

          // A  (voz 0,9 a 4,2): lo orgánico se vende mejor
          lineIn(A[0], 0.9);
          lineIn(A[1], 1.5);
          tl.from("#s2-pend", { y: -300, duration: 1.1, ease: "power3.out" }, 0.9);
          lineOut(A, 4.0);
          tl.to("#s2-va", { opacity: 0, duration: 0.5 }, 4.0);

          // B  (voz 4,2 a 10): dos muros
          lineIn(B[0], 4.5);
          lineIn(B[1], 6.0);
          tl.to("#s2-vb", { opacity: 1, duration: 0.4 }, 4.5);
          tl.fromTo("#s2-slabL", { attr: { y: 600, height: 0 } }, { attr: { y: 190, height: 410 }, duration: 1.0, ease: "power3.out" }, 7.0);
          tl.fromTo("#s2-slabR", { attr: { y: 600, height: 0 } }, { attr: { y: 150, height: 450 }, duration: 1.0, ease: "power3.out" }, 8.0);
          tl.fromTo(["#s2-lblL", "#s2-lblL2"], { opacity: 0 }, { opacity: 1, duration: 0.5, stagger: 0.08 }, 7.4);
          tl.fromTo(["#s2-lblR", "#s2-lblR2"], { opacity: 0 }, { opacity: 1, duration: 0.5, stagger: 0.08 }, 8.4);
          lineOut(B, 9.9);
          tl.to("#s2-vb", { opacity: 0, duration: 0.5 }, 9.9);

          // C  (voz 10 a 17): nadie sabe dónde falla
          lineIn(Cc[0], 10.4);
          lineIn(Cc[1], 14.2);
          tl.to("#s2-vc", { opacity: 1, duration: 0.5 }, 10.4);
          tl.fromTo("#s2-zone", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 11.9);
          tl.fromTo("#s2-zone-ring", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 11.9);
          tl.fromTo("#s2-q", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 14.3);
          tl.fromTo("#s2-lblC", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 14.6);

          window.__timelines["s2-problema"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
