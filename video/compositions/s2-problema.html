<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Montserrat", sans-serif;
        }
        #s2-cam {
          position: absolute;
          inset: 0;
        }
        .h2 {
          top: 330px;
          width: 840px;
          font-size: 118px;
        }
        #s2-frame {
          left: 1000px;
          top: 170px;
          width: 800px;
          height: 740px;
        }
        #s2-frame svg {
          width: 800px;
          height: 740px;
        }
        .lbl {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 700;
          font-size: 21px;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          fill: #12301f;
        }
      </style>

      <div data-hf-id="hf-vauf" id="root" data-composition-id="s2-problema" data-width="1920" data-height="1080">
        <div data-hf-id="hf-69oc" id="s2-cam">
          <h2 data-hf-id="hf-c1hw" id="s2-ha" class="h h2"><span data-hf-id="hf-smev" class="ln"><span data-hf-id="hf-yl05" class="in">Lo orgánico</span></span><span data-hf-id="hf-oupj" class="ln"><span data-hf-id="hf-pwz6" class="in">vale <span data-hf-id="hf-3bly" class="mk" id="s2-mka"><span data-hf-id="hf-ta5a">más.</span></span></span></span></h2>
          <h2 data-hf-id="hf-mwzj" id="s2-hb" class="h h2"><span data-hf-id="hf-ogei" class="ln"><span data-hf-id="hf-4tfu" class="in">Pero hay</span></span><span data-hf-id="hf-o23h" class="ln"><span data-hf-id="hf-k88c" class="in"><span data-hf-id="hf-zdhx" class="mk" id="s2-mkb"><span data-hf-id="hf-boaj">dos muros.</span></span></span></span></h2>
          <h2 data-hf-id="hf-iyvi" id="s2-hc" class="h h2"><span data-hf-id="hf-qu8o" class="ln"><span data-hf-id="hf-07wb" class="in">Y nadie sabe</span></span><span data-hf-id="hf-qfxn" class="ln"><span data-hf-id="hf-i3ca" class="in">dónde <span data-hf-id="hf-ylu4" class="mk" id="s2-mkc"><span data-hf-id="hf-e91f">falla.</span></span></span></span></h2>

          <div data-hf-id="hf-c7ra" id="s2-frame" class="frame">
            <!-- A: el orgánico se vende mejor (comparación sin números) -->
            <svg data-hf-id="hf-pd1r" id="s2-va" viewBox="0 0 800 740">
              <rect data-hf-id="hf-jxbd" x="110" y="620" width="580" height="3" fill="#12301f" opacity="0.4" />
              <rect data-hf-id="hf-6ifq" id="s2-barC" x="190" y="620" width="150" height="0" fill="#2f7d4f" />
              <rect data-hf-id="hf-ejpo" id="s2-barO" x="460" y="620" width="150" height="0" fill="#8cc21f" />
              <line data-hf-id="hf-1qn4" id="s2-ref" x1="340" y1="400" x2="640" y2="400" stroke="#5a7564" stroke-width="2" stroke-dasharray="8 8" opacity="0" />
              <g data-hf-id="hf-3sgp" id="s2-prem" opacity="0">
                <line data-hf-id="hf-b2ud" x1="640" y1="262" x2="640" y2="398" stroke="#4f8a0b" stroke-width="4" />
                <path data-hf-id="hf-l9dy" d="M 628 276 L 640 258 L 652 276 M 628 384 L 640 402 L 652 384" fill="none" stroke="#4f8a0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                <text data-hf-id="hf-i33x" x="664" y="324" font-family="IBM Plex Mono" font-weight="700" font-size="20" letter-spacing="2" fill="#4f8a0b">PRECIO</text>
                <text data-hf-id="hf-7fg9" x="664" y="352" font-family="IBM Plex Mono" font-weight="700" font-size="20" letter-spacing="2" fill="#4f8a0b">PREMIUM</text>
              </g>
              <text data-hf-id="hf-ej0l" id="s2-lblC0" class="lbl" x="265" y="662" text-anchor="middle">Convencional</text>
              <text data-hf-id="hf-10wi" id="s2-lblO0" class="lbl" x="535" y="662" text-anchor="middle">Orgánico</text>
            </svg>

            <!-- B: dos muros -->
            <svg data-hf-id="hf-yxtg" id="s2-vb" viewBox="0 0 800 740">
              <rect data-hf-id="hf-hzgz" x="110" y="560" width="580" height="3" fill="#12301f" opacity="0.5" />
              <rect data-hf-id="hf-yjek" id="s2-slabL" x="170" y="190" width="190" height="370" fill="#7a6340" />
              <g data-hf-id="hf-yutq" id="s2-cracks" fill="none" stroke="#12301f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
                <path data-hf-id="hf-a668" d="M 215 190 L 240 262 L 212 330 L 252 410 L 228 480" />
                <path data-hf-id="hf-sziw" d="M 330 190 L 306 276 L 334 360" />
              </g>
              <rect data-hf-id="hf-vqrs" id="s2-slabR" x="440" y="150" width="190" height="410" fill="#ff7a5c" />
              <g data-hf-id="hf-o3mb" id="s2-beeB"></g>
              <text data-hf-id="hf-sew5" id="s2-q" x="640" y="120" font-family="Montserrat" font-weight="900" font-size="72" fill="#ff7a5c">?</text>
              <text data-hf-id="hf-dind" id="s2-lblL" class="lbl" x="265" y="612" text-anchor="middle">Suelos</text>
              <text data-hf-id="hf-knep" id="s2-lblL2" class="lbl" x="265" y="640" text-anchor="middle">agotados</text>
              <text data-hf-id="hf-bknf" id="s2-lblR" class="lbl" x="535" y="612" text-anchor="middle">Polinización</text>
              <text data-hf-id="hf-i6bk" id="s2-lblR2" class="lbl" x="535" y="640" text-anchor="middle">incierta</text>
            </svg>

            <!-- C: lote -->
            <svg data-hf-id="hf-msdh" id="s2-vc" viewBox="0 0 800 740">
              <defs data-hf-id="hf-mh0t">
                <pattern data-hf-id="hf-rimy" id="s2-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line data-hf-id="hf-9mk4" x1="0" y1="0" x2="0" y2="12" stroke="#ff7a5c" stroke-width="3" /></pattern>
                <clipPath data-hf-id="hf-ycgf" id="s2-lot-clip"><rect data-hf-id="hf-dvpi" x="70" y="120" width="660" height="440" /></clipPath>
                <clipPath data-hf-id="hf-jf8s" id="s2-zone-clip"><ellipse data-hf-id="hf-2sug" cx="400" cy="340" rx="150" ry="120" /></clipPath>
              </defs>
              <g data-hf-id="hf-frnn" id="s2-bands"></g>
              <rect data-hf-id="hf-0boq" x="70" y="120" width="660" height="440" fill="#e6eed4" />
              <g data-hf-id="hf-yf61" clip-path="url(#s2-lot-clip)"><g data-hf-id="hf-vgri" id="s2-rows"></g></g>
              <rect data-hf-id="hf-utkw" x="70" y="120" width="660" height="440" fill="none" stroke="#c5d1b1" stroke-width="2" />
              <g data-hf-id="hf-tyoi" clip-path="url(#s2-zone-clip)" id="s2-zone"><rect data-hf-id="hf-sn3i" x="70" y="120" width="660" height="440" fill="#e6eed4" /><rect data-hf-id="hf-iyrg" x="70" y="120" width="660" height="440" fill="url(#s2-hatch)" opacity="0.85" /></g>
              <ellipse data-hf-id="hf-lcav" id="s2-zone-ring" cx="400" cy="340" rx="150" ry="120" fill="none" stroke="#ff7a5c" stroke-width="3" stroke-dasharray="10 9" />
              <text data-hf-id="hf-si3w" id="s2-qc" x="400" y="378" text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="120" fill="#ff7a5c">?</text>
              <g data-hf-id="hf-z2pe" id="s2-bees"></g>
            </svg>
            <div data-hf-id="hf-rsfg" class="br tl"></div><div data-hf-id="hf-2rei" class="br tr"></div><div data-hf-id="hf-gsq6" class="br bl"></div><div data-hf-id="hf-a3p4" class="br rb"></div>
            <div data-hf-id="hf-gime" id="s2-pillC" class="pill warn" style="opacity:0">Centro del lote · sin datos</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const mk = PN.mk;
          const DUR = 18;
          const $ = (id) => document.getElementById(id);
          const ins = (id) => Array.from(document.querySelectorAll(id + " .in"));
          const A = ins("#s2-ha"), B = ins("#s2-hb"), Cc = ins("#s2-hc");

          for (let i = 0; i < 10; i++) mk($("s2-bands"), "rect", { x: 0, y: i * 76, width: 800, height: 76, fill: i % 2 ? "#14402a" : "#123524" });
          PN.rows($("s2-rows"), 92, 148, 720, 548, 36, 30, "#138a5f", 6, 0.3);

          const beeB = PN.bee($("s2-beeB"), { scale: 1.7 });
          const flows = [0, 1, 2].map((k) => {
            const y0 = 240 + k * 100;
            const d = "M 70 " + (y0 + 10) + " C 160 " + (y0 - 40) + ", 220 " + (y0 + 40) + ", 290 " + y0;
            return { pts: PN.samplePath($("s2-vc"), d, 50), bee: PN.bee($("s2-bees"), { scale: 1.4 }), k: k };
          });

          const tl = PN.timeline();

          PN.clock(tl, DUR, function (t) {
            // B: abeja perdida sobre el muro de la polinización
            const bt = t - 6.0;
            const bx = 535 + 90 * Math.sin(bt * 1.2), by = 96 + 30 * Math.sin(bt * 2.4);
            PN.fly(beeB, bx, by, Math.cos(bt * 1.2) * 90 * 1.2, Math.cos(bt * 2.4) * 30 * 2.4, 0.4);
            beeB.flap(t, 0);
            // C: abejas que se acercan y se detienen antes del centro
            flows.forEach((f) => {
              const raw = (t - 11.0 - f.k * 0.9) / 3.2;
              if (raw < 0) {
                f.bee.g.setAttribute("opacity", 0);
                return;
              }
              const u = raw - Math.floor(raw);
              const p = PN.at(f.pts, PN.ease(u));
              f.bee.place(p.x, p.y + Math.sin(t * 7 + f.k) * 3, p.ang * 0.5);
              f.bee.g.setAttribute("opacity", (PN.clamp(u / 0.12, 0, 1) * (1 - PN.clamp((u - 0.72) / 0.24, 0, 1))).toFixed(2));
              f.bee.flap(t, f.k);
            });
          });

          tl.fromTo("#s2-cam", { scale: 1, transformOrigin: "55% 55%" }, { scale: 1.025, duration: DUR, ease: "sine.inOut" }, 0);
          tl.set([A, B, Cc], { yPercent: 130 }, 0);
          tl.set(["#s2-mka", "#s2-mkb", "#s2-mkc"], { "--mk": 0, color: "#12301f" }, 0);
          tl.set(["#s2-vb", "#s2-vc"], { opacity: 0 }, 0);
          tl.fromTo("#s2-frame", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.3);

          const lineIn = (el, at) => tl.to(el, { yPercent: 0, duration: 0.9, ease: "power3.out" }, at);
          const lineOut = (el, at) => tl.to(el, { yPercent: -130, duration: 0.55, ease: "power3.in" }, at);
          const mark = (id, at) => {
            tl.to(id, { "--mk": 1, duration: 0.6, ease: "power3.out" }, at);
            tl.to(id, { color: "#12301f", duration: 0.01 }, at + 0.3);
          };

          // A  (voz 0,9 a 4,2): lo orgánico vale más
          lineIn(A[0], 0.9);
          lineIn(A[1], 1.6);
          mark("#s2-mka", 2.4);
          tl.fromTo("#s2-barC", { attr: { y: 620, height: 0 } }, { attr: { y: 400, height: 220 }, duration: 0.9, ease: "power3.out" }, 1.1);
          tl.fromTo("#s2-barO", { attr: { y: 620, height: 0 } }, { attr: { y: 260, height: 360 }, duration: 1.1, ease: "power3.out" }, 1.8);
          tl.fromTo(["#s2-lblC0", "#s2-lblO0"], { opacity: 0 }, { opacity: 1, duration: 0.5, stagger: 0.7 }, 1.4);
          tl.to("#s2-ref", { opacity: 1, duration: 0.4 }, 3.0);
          tl.to("#s2-prem", { opacity: 1, duration: 0.5 }, 3.2);
          lineOut(A, 4.0);
          tl.set("#s2-ha", { opacity: 0 }, 4.5);
          tl.to("#s2-va", { opacity: 0, duration: 0.5 }, 4.0);

          // B  (voz 4,2 a 10): dos muros
          lineIn(B[0], 4.5);
          lineIn(B[1], 6.0);
          mark("#s2-mkb", 6.6);
          tl.to("#s2-vb", { opacity: 1, duration: 0.4 }, 4.5);
          tl.fromTo("#s2-slabL", { attr: { y: 560, height: 0 } }, { attr: { y: 190, height: 370 }, duration: 1.0, ease: "power3.out" }, 7.0);
          tl.fromTo("#s2-cracks", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 8.0);
          tl.fromTo("#s2-slabR", { attr: { y: 560, height: 0 } }, { attr: { y: 150, height: 410 }, duration: 1.0, ease: "power3.out" }, 8.0);
          tl.fromTo(["#s2-lblL", "#s2-lblL2"], { opacity: 0 }, { opacity: 1, duration: 0.5, stagger: 0.08 }, 7.4);
          tl.fromTo(["#s2-lblR", "#s2-lblR2"], { opacity: 0 }, { opacity: 1, duration: 0.5, stagger: 0.08 }, 8.4);
          tl.fromTo(["#s2-beeB", "#s2-q"], { opacity: 0 }, { opacity: 1, duration: 0.5 }, 8.8);
          lineOut(B, 9.9);
          tl.set("#s2-hb", { opacity: 0 }, 10.5);
          tl.to("#s2-vb", { opacity: 0, duration: 0.5 }, 9.9);

          // C  (voz 10 a 17): nadie sabe dónde falla
          lineIn(Cc[0], 10.4);
          lineIn(Cc[1], 14.0);
          mark("#s2-mkc", 14.6);
          tl.to("#s2-vc", { opacity: 1, duration: 0.5 }, 10.4);
          tl.fromTo("#s2-zone", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 11.9);
          tl.fromTo("#s2-zone-ring", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 11.9);
          tl.fromTo("#s2-qc", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 14.3);
          tl.to("#s2-pillC", { opacity: 1, duration: 0.6 }, 14.6);

          window.__timelines["s2-problema"] = PN.raw(tl);
        })();
      </script>
    </template>
  </body>
</html>
