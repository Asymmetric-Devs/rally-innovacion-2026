<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <!--
        ESCENA 4: PIZARRÓN (25 s).
        0 a 18,5 s: la toma real completa (assets/pizarron.mp4, audio limpiado con fundidos), incluida la charla del grupo al principio.
        18,5 a 25 s: se congela el último cuadro (assets/pizarron-last.jpg) y se lo repasa en líneas limpias.
        Para cambiar la toma: reemplazar assets/pizarron.mp4, sacar de nuevo el último cuadro y ajustar data-duration y los tiempos de abajo.
      -->
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #f2f6e6;
          font-family: "Montserrat", sans-serif;
        }
        #s4-zoom {
          position: absolute;
          inset: 0;
        }
        #s4-footage,
        #s4-still {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
          object-fit: cover;
        }
        #s4-veil {
          position: absolute;
          inset: 0;
          background: #f2f6e6;
          opacity: 0;
        }
        #s4-over {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
        }
        .vbr {
          position: absolute;
          width: 64px;
          height: 64px;
          border: 0 solid #12301f;
          pointer-events: none;
        }
        .vbr.tl { left: 48px; top: 48px; border-top-width: 4px; border-left-width: 4px; }
        .vbr.tr { right: 48px; top: 48px; border-top-width: 4px; border-right-width: 4px; }
        .vbr.bl { left: 48px; bottom: 48px; border-bottom-width: 4px; border-left-width: 4px; }
        .vbr.rb { right: 48px; bottom: 48px; border-bottom-width: 4px; border-right-width: 4px; }
        #s4-tag {
          position: absolute;
          left: 128px;
          top: 72px;
        }
        .sub {
          position: absolute;
          left: 50%;
          bottom: 100px;
          transform: translateX(-50%);
          padding: 16px 30px 14px 34px;
          background: rgba(251, 253, 244, 0.94);
          border-left: 6px solid #8cc21f;
          color: #12301f;
          font-size: 40px;
          font-weight: 700;
          letter-spacing: -0.015em;
          white-space: nowrap;
          opacity: 0;
        }
        #s4-steps {
          position: absolute;
          left: 1230px;
          top: 150px;
          width: 560px;
        }
        .step {
          display: flex;
          align-items: center;
          gap: 22px;
          margin-bottom: 16px;
          padding: 20px 24px;
          background: rgba(251, 253, 244, 0.95);
          border: 1px solid #c5d1b1;
          border-left: 6px solid #8cc21f;
          opacity: 0;
        }
        .step span {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 700;
          font-size: 22px;
          letter-spacing: 0.12em;
          color: #4f8a0b;
        }
        .step p {
          font-weight: 900;
          font-size: 36px;
          letter-spacing: -0.025em;
          color: #12301f;
        }
      </style>

      <div data-hf-id="hf-u58w" id="root" data-composition-id="s4-pizarron" data-width="1920" data-height="1080">
        <div data-hf-id="hf-ra9s" id="s4-zoom">
          <video data-hf-id="hf-71rw" id="s4-footage" class="clip" src="assets/pizarron.mp4" data-start="0" data-duration="18.47" data-track-index="0" data-has-audio="true" playsinline></video>
          <img data-hf-id="hf-hwwj" id="s4-still" src="assets/pizarron-last.jpg" alt="" />
          <div data-hf-id="hf-ny6t" id="s4-veil"></div>

          <svg data-hf-id="hf-hae0" id="s4-over" viewBox="0 0 1920 1080">
            <defs data-hf-id="hf-mh0t">
              <clipPath data-hf-id="hf-nnn1" id="s4-lot-clip"><rect data-hf-id="hf-e5id" x="720" y="290" width="510" height="380" /></clipPath>
              <pattern data-hf-id="hf-ivik" id="s4-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line data-hf-id="hf-9mk4" x1="0" y1="0" x2="0" y2="12" stroke="#ff7a5c" stroke-width="3" /></pattern>
            </defs>
            <g data-hf-id="hf-1gvn" clip-path="url(#s4-lot-clip)">
              <rect data-hf-id="hf-kldx" id="s4-lot-fill" x="720" y="290" width="510" height="380" fill="#fbfdf4" opacity="0" />
              <ellipse data-hf-id="hf-tu1a" id="s4-dead" cx="1150" cy="490" rx="92" ry="112" fill="url(#s4-hatch)" opacity="0" />
            </g>
            <path data-hf-id="hf-cy6b" id="s4-lot" d="M 720 290 H 1230 V 670 H 720 Z" pathLength="1" fill="none" stroke="#4f8a0b" stroke-width="5" stroke-linejoin="round" stroke-dasharray="1" stroke-dashoffset="1" />
            <ellipse data-hf-id="hf-n0le" id="s4-dead-ring" cx="1150" cy="490" rx="92" ry="112" fill="none" stroke="#ff7a5c" stroke-width="3" stroke-dasharray="10 9" opacity="0" />
            <g data-hf-id="hf-ie9l" id="s4-rings" fill="none" stroke="#138a5f" stroke-width="3"></g>
            <g data-hf-id="hf-jlpb" id="s4-trail" fill="#8cc21f"></g>
            <g data-hf-id="hf-flgx" id="s4-cloud" transform="translate(546 426)">
              <g data-hf-id="hf-pnna" id="s4-cloud-in">
                <ellipse data-hf-id="hf-tpgz" cx="0" cy="0" rx="110" ry="40" fill="#fbfdf4" stroke="#12301f" stroke-width="3" />
                <text data-hf-id="hf-kthx" x="0" y="7" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="19" letter-spacing="2" fill="#4f8a0b">POLINIZADORES</text>
              </g>
            </g>
            <g data-hf-id="hf-b4yt" id="s4-totems"></g>
            <g data-hf-id="hf-oadv" id="s4-isl-outer"><g data-hf-id="hf-0jgp" id="s4-isl"></g></g>
            <g data-hf-id="hf-wtuk" id="s4-bees"></g>
          </svg>
        </div>

        <div data-hf-id="hf-c252" class="vbr tl"></div><div data-hf-id="hf-9nkg" class="vbr tr"></div><div data-hf-id="hf-lbg4" class="vbr bl"></div><div data-hf-id="hf-65aq" class="vbr rb"></div>
        <div data-hf-id="hf-ojo7" id="s4-tag" class="pill">La idea · en el pizarrón</div>
        <div data-hf-id="hf-3qf8" class="sub" id="s4-sub1">Los polinizadores no llegan a todas las áreas.</div>
        <div data-hf-id="hf-ms49" class="sub" id="s4-sub2">Entonces, implementando estos sensores inteligentes,</div>
        <div data-hf-id="hf-py8b" class="sub" id="s4-sub3">podemos decirle al agricultor dónde ir moviendo esta isla.</div>

        <div data-hf-id="hf-63u6" id="s4-steps">
          <div data-hf-id="hf-rc5g" class="step" id="s4-st1"><span data-hf-id="hf-p81i">01</span><p data-hf-id="hf-vf4i">Los sensores miden</p></div>
          <div data-hf-id="hf-27n3" class="step" id="s4-st2"><span data-hf-id="hf-pmcj">02</span><p data-hf-id="hf-6ais">El mapa marca la zona</p></div>
          <div data-hf-id="hf-w1xa" class="step" id="s4-st3"><span data-hf-id="hf-q0nk">03</span><p data-hf-id="hf-gut1">La isla se mueve ahí</p></div>
        </div>
      </div>

      <script>
        (function () {
          const mk = PN.mk;
          const DUR = 22.5;
          const T0 = 18.5;
          const $ = (id) => document.getElementById(id);

          // sensores (posición de los tótems dibujados en el pizarrón)
          const TX = [810, 902, 1020, 1144];
          const totems = TX.map((x) => {
            const g = mk($("s4-totems"), "g", {});
            mk(g, "line", { x1: x, y1: 664, x2: x, y2: 590, stroke: "#12301f", "stroke-width": 6, "stroke-linecap": "round" });
            mk(g, "rect", { x: x - 20, y: 548, width: 40, height: 34, rx: 5, fill: "#fbfdf4", stroke: "#12301f", "stroke-width": 4 });
            mk(g, "circle", { cx: x, cy: 565, r: 8, fill: "#8cc21f" });
            mk(g, "circle", { cx: x + 16, cy: 536, r: 5, fill: "#ff7a5c" });
            mk(g, "line", { x1: x + 10, y1: 548, x2: x + 15, y2: 540, stroke: "#12301f", "stroke-width": 3 });
            return g;
          });
          const rings = [];
          TX.forEach((x, i) => {
            for (let k = 0; k < 2; k++) rings.push({ el: mk($("s4-rings"), "circle", { cx: x, cy: 565, r: 0, opacity: 0 }), i: i, k: k });
          });

          // isla
          const IX = 952, IY = 476;
          mk($("s4-isl"), "path", { d: PN.blob(IX + 6, IY + 12, 84, 74, 0.4), fill: "#000", opacity: 0.35 });
          mk($("s4-isl"), "path", { d: PN.blob(IX, IY, 84, 74, 0.4), fill: "#1d5c3e" });
          mk($("s4-isl"), "path", { d: PN.blob(IX - 8, IY - 8, 62, 52, 1.2), fill: "#2f7d4f" });
          const fr = PN.rng(17);
          const petals = ["#ff7a5c", "#f5b83d", "#ffffff"];
          const flowers = [];
          for (let k = 0; k < 8; k++) {
            const a = fr() * 6.28, d = Math.sqrt(fr()) * 48;
            flowers.push(PN.flower($("s4-isl"), IX + Math.cos(a) * d * 1.1, IY + Math.sin(a) * d * 0.9, 12 + fr() * 4, petals[k % 3], "#12301f"));
          }

          // rastro punteado de la isla (aparece con el movimiento)
          const tpts = PN.samplePath($("s4-over"), "M 952 476 C 1010 380, 1100 390, 1142 502", 60);
          const tdots = [];
          for (let i = 0; i < 22; i++) {
            const p = PN.at(tpts, i / 21);
            tdots.push(mk($("s4-trail"), "circle", { cx: p.x, cy: p.y, r: 3.2, opacity: 0 }));
          }
          const bees = [0, 1, 2].map((i) => ({ bee: PN.bee($("s4-bees"), { scale: 1.5 }), i: i }));

          const tl = gsap.timeline({ paused: true });
          const MV = T0 + 2.52; // la isla se mueve

          PN.clock(tl, DUR, function (t) {
            const u = PN.ease(PN.clamp((t - MV) / 1.3, 0, 1));
            const dx = 190 * u, dy = 26 * u - 64 * Math.sin(Math.PI * u);
            $("s4-isl-outer").setAttribute("transform", "translate(" + dx.toFixed(1) + " " + dy.toFixed(1) + ")");
            flowers.forEach((f, k) => f.inner.setAttribute("transform", "rotate(" + (Math.sin(t * 1.3 + k) * 7).toFixed(2) + ")"));
            tdots.forEach((d, i) => d.setAttribute("opacity", t > MV && i / 21 <= u ? 0.8 : 0));
            bees.forEach((b) => {
              const i = b.i;
              let x, y, x2, y2;
              if (t < MV) {
                const w = PN.clamp((t - (T0 + 0.65) - i * 0.4) / 2.4, 0, 1);
                x = 620 + 170 * PN.ease(w);
                y = 426 + (i - 1) * 26 - 28 * Math.sin(Math.PI * w);
                x2 = x + 8;
                y2 = y;
              } else {
                const f = (tt) => [952 + dx + 125 * Math.cos(tt * (1.1 + i * 0.1) + i * 2.1), 476 + dy + 88 * Math.sin((tt * (1.1 + i * 0.1) + i * 2.1) * 1.2)];
                [x, y] = f(t);
                [x2, y2] = f(t + 0.05);
              }
              PN.fly(b.bee, x, y, x2 - x, y2 - y, 0.3);
              b.bee.flap(t, i);
              b.bee.g.setAttribute("opacity", PN.clamp((t - (T0 + 0.65) - i * 0.4) / 0.4, 0, 1).toFixed(2));
            });
            rings.forEach((r) => {
              if (t < T0 + 1.22) {
                r.el.setAttribute("opacity", 0);
                return;
              }
              const ph = ((((t - T0 - 1.2) / 1.8 - r.k / 2 - r.i * 0.15) % 1) + 1) % 1;
              r.el.setAttribute("r", (12 + ph * 80).toFixed(1));
              r.el.setAttribute("opacity", ((1 - ph) * 0.9).toFixed(2));
            });
          });

          // toma real + zoom muy lento
          tl.fromTo("#s4-zoom", { scale: 1, transformOrigin: "62% 44%" }, { scale: 1.04, duration: T0, ease: "sine.inOut" }, 0);
          tl.set("#s4-still", { opacity: 0 }, 0);
          tl.set("#s4-still", { opacity: 1 }, T0 - 0.04);
          tl.to("#s4-zoom", { scale: 1.07, duration: DUR - T0, ease: "sine.inOut", transformOrigin: "52% 48%" }, T0);

          // etiqueta y subtítulos (la charla del grupo del principio queda sin subtítulos, como en la toma)
          tl.fromTo("#s4-tag", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.4);
          tl.to("#s4-tag", { opacity: 0, duration: 0.4 }, T0 - 0.3);
          const sub = (id, a, b) => {
            tl.fromTo(id, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, a);
            tl.to(id, { opacity: 0, duration: 0.3 }, b - 0.3);
          };
          sub("#s4-sub1", 7.0, 10.2);
          sub("#s4-sub2", 10.2, 13.2);
          sub("#s4-sub3", 13.2, 18.4);

          // repaso en líneas limpias
          tl.fromTo("#s4-veil", { opacity: 0 }, { opacity: 0.66, duration: 0.7 }, T0);
          tl.to("#s4-lot", { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" }, T0 + 0.29);
          tl.to("#s4-lot-fill", { opacity: 0.85, duration: 0.6 }, T0 + 0.72);
          tl.fromTo("#s4-cloud-in", { opacity: 0 }, { opacity: 1, duration: 0.6 }, T0 + 0.58);
          tl.fromTo("#s4-isl", { opacity: 0, scale: 0.4, svgOrigin: IX + " " + IY }, { opacity: 1, scale: 1, svgOrigin: IX + " " + IY, duration: 0.8, ease: "power3.out" }, T0 + 0.86);
          totems.forEach((g, i) => tl.fromTo(g, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, T0 + 1.08 + i * 0.15));
          tl.fromTo("#s4-dead", { opacity: 0 }, { opacity: 0.9, duration: 0.7 }, T0 + 1.58);
          tl.fromTo("#s4-dead-ring", { opacity: 0 }, { opacity: 1, duration: 0.6 }, T0 + 1.58);
          tl.to("#s4-dead", { opacity: 0.15, duration: 0.7 }, MV + 1.3);
          tl.to("#s4-dead-ring", { opacity: 0, duration: 0.5 }, MV + 1.3);

          tl.set(["#s4-st1", "#s4-st2", "#s4-st3"], { opacity: 0 }, 0);
          [["#s4-st1", T0 + 0.72], ["#s4-st2", T0 + 1.44], ["#s4-st3", T0 + 2.16]].forEach((s) => tl.fromTo(s[0], { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, s[1]));

          window.__timelines["s4-pizarron"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
