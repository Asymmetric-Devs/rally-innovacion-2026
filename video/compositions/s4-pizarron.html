<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <!--
        ESCENA 4: PIZARRÓN (18 s).
        0 a 12 s: la toma real (assets/pizarron.mp4, audio limpiado) con subtítulos.
        12 a 18 s: se congela el último cuadro (assets/pizarron-last.jpg) y se lo repasa en líneas limpias.
        Para cambiar la toma: reemplazar assets/pizarron.mp4, sacar de nuevo el último cuadro y ajustar data-duration y los tiempos de abajo.
      -->
      <style>
        @font-face {
          font-family: "Instrument Serif";
          font-style: normal;
          src: url("assets/fonts/InstrumentSerif-Regular.woff2") format("woff2");
        }
        @font-face {
          font-family: "Instrument Serif";
          font-style: italic;
          src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2");
        }
        @font-face {
          font-family: "Instrument Sans";
          font-weight: 400 700;
          src: url("assets/fonts/InstrumentSans.woff2") format("woff2");
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #1d1b19;
          font-family: "Instrument Sans", sans-serif;
          color: #1d1b19;
        }
        #s4-zoom {
          position: absolute;
          inset: 0;
        }
        #s4-footage,
        #s4-still {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
          object-fit: cover;
        }
        #s4-veil {
          position: absolute;
          inset: 0;
          background: #f4efe6;
          opacity: 0;
        }
        #s4-over {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
        }
        .tag {
          position: absolute;
          left: 64px;
          top: 56px;
          padding: 12px 20px 10px;
          background: rgba(244, 239, 230, 0.94);
          font-size: 20px;
          font-weight: 600;
          letter-spacing: 0.18em;
          text-transform: uppercase;
        }
        .tag b {
          color: #c4502f;
          margin-right: 14px;
        }
        .sub {
          position: absolute;
          left: 50%;
          bottom: 64px;
          transform: translateX(-50%);
          padding: 14px 28px 12px;
          background: rgba(29, 27, 25, 0.82);
          color: #f4efe6;
          font-size: 40px;
          font-weight: 500;
          white-space: nowrap;
          opacity: 0;
        }
        #s4-steps {
          position: absolute;
          left: 1280px;
          top: 150px;
          width: 560px;
        }
        .step {
          display: flex;
          align-items: baseline;
          gap: 22px;
          padding: 18px 0 16px;
          border-top: 2px solid #1d1b19;
          background: rgba(244, 239, 230, 0.9);
          opacity: 0;
        }
        .step span {
          font-size: 20px;
          font-weight: 600;
          letter-spacing: 0.16em;
          color: #c4502f;
          padding-left: 6px;
        }
        .step p {
          font-family: "Instrument Serif", serif;
          font-size: 54px;
          line-height: 1.05;
        }
      </style>

      <div id="root" data-composition-id="s4-pizarron" data-width="1920" data-height="1080">
        <div id="s4-zoom">
          <video id="s4-footage" class="clip" src="assets/pizarron.mp4" data-start="0" data-duration="12" data-track-index="0" data-has-audio="true" data-volume="1.3" playsinline></video>
          <img id="s4-still" src="assets/pizarron-last.jpg" alt="" />
          <div id="s4-veil"></div>

          <svg id="s4-over" viewBox="0 0 1920 1080">
            <defs><clipPath id="s4-lot-clip"><rect x="720" y="290" width="510" height="380" /></clipPath></defs>
            <g clip-path="url(#s4-lot-clip)">
              <ellipse id="s4-dead" cx="1150" cy="490" rx="92" ry="112" fill="url(#hatch-clay)" opacity="0" />
            </g>
            <path id="s4-lot" d="M 720 290 H 1230 V 670 H 720 Z" pathLength="1" fill="none" stroke="#1d1b19" stroke-width="5" stroke-linejoin="round" stroke-dasharray="1" stroke-dashoffset="1" />
            <ellipse id="s4-dead-ring" cx="1150" cy="490" rx="92" ry="112" fill="none" stroke="#c4502f" stroke-width="3" stroke-dasharray="10 9" opacity="0" />
            <g id="s4-rings" fill="none" stroke="#e5a02d" stroke-width="3"></g>
            <g id="s4-trail" fill="#1d1b19"></g>
            <g id="s4-cloud" transform="translate(546 426)">
              <g id="s4-cloud-in">
                <ellipse cx="0" cy="0" rx="104" ry="40" fill="#f4efe6" stroke="#1d1b19" stroke-width="3" />
                <text x="0" y="8" text-anchor="middle" font-family="Instrument Serif" font-style="italic" font-size="30" fill="#c4502f">polinizadores</text>
              </g>
            </g>
            <g id="s4-totems"></g>
            <g id="s4-isl-outer"><g id="s4-isl"></g></g>
            <g id="s4-bees"></g>
          </svg>
        </div>

        <div class="tag" id="s4-tag"><b>04</b>La idea, en el pizarrón</div>
        <div class="sub" id="s4-sub1">Los polinizadores no llegan a todas las áreas.</div>
        <div class="sub" id="s4-sub2">Entonces, implementando estos sensores inteligentes,</div>
        <div class="sub" id="s4-sub3">podemos decirle al agricultor dónde ir moviendo esta isla.</div>

        <div id="s4-steps">
          <div class="step" id="s4-st1"><span>01</span><p>Los sensores miden</p></div>
          <div class="step" id="s4-st2"><span>02</span><p>El mapa marca la zona</p></div>
          <div class="step" id="s4-st3"><span>03</span><p>La isla se mueve ahí</p></div>
        </div>
      </div>

      <script>
        (function () {
          const mk = PN.mk;
          const DUR = 18;
          const $ = (id) => document.getElementById(id);

          // sensores (posición de los tótems dibujados en el pizarrón)
          const TX = [810, 902, 1020, 1144];
          const totems = TX.map((x) => {
            const g = mk($("s4-totems"), "g", {});
            mk(g, "line", { x1: x, y1: 664, x2: x, y2: 590, stroke: "#1d1b19", "stroke-width": 6, "stroke-linecap": "round" });
            mk(g, "rect", { x: x - 20, y: 548, width: 40, height: 34, rx: 5, fill: "#f4efe6", stroke: "#1d1b19", "stroke-width": 4 });
            mk(g, "circle", { cx: x, cy: 565, r: 8, fill: "#e5a02d" });
            mk(g, "circle", { cx: x + 16, cy: 536, r: 5, fill: "#c4502f" });
            mk(g, "line", { x1: x + 10, y1: 548, x2: x + 15, y2: 540, stroke: "#1d1b19", "stroke-width": 3 });
            return g;
          });
          const rings = [];
          TX.forEach((x, i) => {
            for (let k = 0; k < 2; k++) rings.push({ el: mk($("s4-rings"), "circle", { cx: x, cy: 565, r: 0, opacity: 0 }), i: i, k: k });
          });

          // isla
          const IX = 952, IY = 476;
          mk($("s4-isl"), "path", { d: PN.blob(IX, IY, 84, 74, 0.4), fill: "#33504a" });
          const fr = PN.rng(17);
          const petals = ["#c4502f", "#e5a02d", "#f4efe6"];
          const flowers = [];
          for (let k = 0; k < 8; k++) {
            const a = fr() * 6.28, d = Math.sqrt(fr()) * 48;
            flowers.push(PN.flower($("s4-isl"), IX + Math.cos(a) * d * 1.1, IY + Math.sin(a) * d * 0.9, 12 + fr() * 4, petals[k % 3], "#1d1b19"));
          }

          // rastro punteado de la isla (aparece con el movimiento)
          const tpts = PN.samplePath($("s4-over"), "M 952 476 C 1010 380, 1100 390, 1142 502", 60);
          const tdots = [];
          for (let i = 0; i < 22; i++) {
            const p = PN.at(tpts, i / 21);
            tdots.push(mk($("s4-trail"), "circle", { cx: p.x, cy: p.y, r: 3.2, opacity: 0 }));
          }
          const bees = [0, 1, 2].map((i) => ({ bee: PN.bee($("s4-bees"), { scale: 1.5 }), i: i }));

          const tl = gsap.timeline({ paused: true });
          const T0 = 12.0;

          PN.clock(tl, DUR, function (t) {
            const u = PN.ease(PN.clamp((t - 15.3) / 1.7, 0, 1));
            const dx = 190 * u, dy = 26 * u - 64 * Math.sin(Math.PI * u);
            $("s4-isl-outer").setAttribute("transform", "translate(" + dx.toFixed(1) + " " + dy.toFixed(1) + ")");
            flowers.forEach((f, k) => f.inner.setAttribute("transform", "rotate(" + (Math.sin(t * 1.3 + k) * 7).toFixed(2) + ")"));
            tdots.forEach((d, i) => d.setAttribute("opacity", t > 15.3 && i / 21 <= u ? 0.7 : 0));
            bees.forEach((b) => {
              const i = b.i;
              let x, y, x2, y2;
              if (t < 15.3) {
                const w = PN.clamp((t - 13.0 - i * 0.4) / 2.4, 0, 1);
                x = 620 + 170 * PN.ease(w);
                y = 426 + (i - 1) * 26 - 28 * Math.sin(Math.PI * w);
                x2 = x + 8;
                y2 = y;
              } else {
                const f = (tt) => [952 + dx + 125 * Math.cos(tt * (1.1 + i * 0.1) + i * 2.1), 476 + dy + 88 * Math.sin((tt * (1.1 + i * 0.1) + i * 2.1) * 1.2)];
                [x, y] = f(t);
                [x2, y2] = f(t + 0.05);
              }
              PN.fly(b.bee, x, y, x2 - x, y2 - y, 0.3);
              b.bee.flap(t, i);
              b.bee.g.setAttribute("opacity", PN.clamp((t - 13.0 - i * 0.4) / 0.4, 0, 1).toFixed(2));
            });
            rings.forEach((r) => {
              if (t < 13.8) {
                r.el.setAttribute("opacity", 0);
                return;
              }
              const ph = ((((t - 13.8) / 1.8 - r.k / 2 - r.i * 0.15) % 1) + 1) % 1;
              r.el.setAttribute("r", (12 + ph * 80).toFixed(1));
              r.el.setAttribute("opacity", ((1 - ph) * 0.9).toFixed(2));
            });
          });

          // toma real + zoom muy lento
          tl.fromTo("#s4-zoom", { scale: 1, transformOrigin: "62% 44%" }, { scale: 1.04, duration: 12, ease: "sine.inOut" }, 0);
          tl.set("#s4-still", { opacity: 0 }, 0);
          tl.set("#s4-still", { opacity: 1 }, 11.98);
          tl.to("#s4-zoom", { scale: 1.07, duration: 6, ease: "sine.inOut", transformOrigin: "52% 48%" }, 12);

          // etiqueta y subtítulos
          tl.fromTo("#s4-tag", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.3);
          tl.to("#s4-tag", { opacity: 0, duration: 0.4 }, 11.8);
          const sub = (id, a, b) => {
            tl.fromTo(id, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, a);
            tl.to(id, { opacity: 0, duration: 0.3 }, b - 0.3);
          };
          sub("#s4-sub1", 0.3, 3.5);
          sub("#s4-sub2", 3.5, 6.6);
          sub("#s4-sub3", 6.6, 11.9);

          // repaso en líneas limpias (desde 12 s)
          tl.fromTo("#s4-veil", { opacity: 0 }, { opacity: 0.66, duration: 0.7 }, T0);
          tl.to("#s4-lot", { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" }, T0 + 0.4);
          tl.fromTo("#s4-cloud-in", { opacity: 0 }, { opacity: 1, duration: 0.6 }, T0 + 0.8);
          tl.fromTo("#s4-isl", { opacity: 0, scale: 0.4, svgOrigin: IX + " " + IY }, { opacity: 1, scale: 1, svgOrigin: IX + " " + IY, duration: 0.8, ease: "power3.out" }, T0 + 1.2);
          totems.forEach((g, i) => tl.fromTo(g, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, T0 + 1.5 + i * 0.15));
          tl.fromTo("#s4-dead", { opacity: 0 }, { opacity: 0.9, duration: 0.7 }, 14.3);
          tl.fromTo("#s4-dead-ring", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 14.3);
          tl.to("#s4-dead", { opacity: 0.15, duration: 0.7 }, 17.0);
          tl.to("#s4-dead-ring", { opacity: 0, duration: 0.5 }, 17.0);

          [["#s4-st1", 13.4], ["#s4-st2", 14.5], ["#s4-st3", 15.6]].forEach((s) => tl.fromTo(s[0], { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, s[1]));

          window.__timelines["s4-pizarron"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
