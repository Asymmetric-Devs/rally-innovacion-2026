<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Instrument Serif";
          font-style: normal;
          src: url("assets/fonts/InstrumentSerif-Regular.woff2") format("woff2");
        }
        @font-face {
          font-family: "Instrument Serif";
          font-style: italic;
          src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2");
        }
        @font-face {
          font-family: "Instrument Sans";
          font-weight: 400 700;
          src: url("assets/fonts/InstrumentSans.woff2") format("woff2");
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #f4efe6;
          font-family: "Instrument Serif", serif;
          color: #1d1b19;
        }
        #s3-cam {
          position: absolute;
          inset: 0;
        }
        #s3-title {
          position: absolute;
          left: 120px;
          top: 130px;
          font-size: 118px;
          line-height: 1.02;
          letter-spacing: -0.015em;
          font-weight: 400;
          white-space: nowrap;
        }
        #s3-title .ln {
          display: inline-block;
          overflow: hidden;
          vertical-align: top;
          padding-bottom: 0.14em;
          margin-bottom: -0.14em;
          margin-right: 0.22em;
        }
        #s3-title .in {
          display: block;
        }
        #s3-title em {
          color: #c4502f;
        }
        #s3-map,
        #s3-steps {
          position: absolute;
          left: 120px;
          width: 1680px;
        }
        #s3-map {
          top: 330px;
          height: 460px;
        }
        #s3-steps {
          top: 836px;
          height: 150px;
        }
        .lbl {
          font-family: "Instrument Sans", sans-serif;
          font-weight: 600;
          font-size: 24px;
          letter-spacing: 0.16em;
          text-transform: uppercase;
        }
        .desc {
          font-family: "Instrument Sans", sans-serif;
          font-weight: 400;
          font-size: 30px;
        }
      </style>

      <div id="root" data-composition-id="s3-islas" data-width="1920" data-height="1080">
        <div id="s3-cam">
          <h2 id="s3-title"><span class="ln"><span class="in">Islas</span></span><span class="ln"><span class="in"><em>biodinámicas</em></span></span><span class="ln"><span class="in">rotativas</span></span></h2>

          <svg id="s3-map" viewBox="0 0 1680 460">
            <defs>
              <filter id="s3-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22" /></filter>
              <mask id="s3-bloom-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1680" height="460">
                <rect x="0" y="0" width="1680" height="460" fill="black" />
                <g filter="url(#s3-soft)" fill="white">
                  <circle id="s3-m0" cx="330" cy="250" r="0" />
                  <circle id="s3-m1" cx="790" cy="250" r="0" />
                  <circle id="s3-m2" cx="1250" cy="250" r="0" />
                </g>
              </mask>
              <clipPath id="s3-lot-clip"><rect x="0" y="0" width="1680" height="460" /></clipPath>
            </defs>
            <rect x="0" y="0" width="1680" height="460" fill="#ebe4d6" />
            <g clip-path="url(#s3-lot-clip)">
              <g id="s3-rows"></g>
              <g id="s3-bloom" mask="url(#s3-bloom-mask)"></g>
              <g id="s3-rich"></g>
              <g id="s3-islands"></g>
              <g id="s3-nitro"></g>
              <g id="s3-bees"></g>
            </g>
            <text id="s3-year1" class="lbl" x="1660" y="38" text-anchor="end" fill="#1d1b19">Año 1</text>
            <text id="s3-year2" class="lbl" x="1660" y="38" text-anchor="end" fill="#c4502f">Año 2</text>
          </svg>

          <svg id="s3-steps" viewBox="0 0 1680 150">
            <rect x="0" y="22" width="1680" height="2" fill="#1d1b19" opacity="0.2" />
            <rect id="s3-prog" x="0" y="21" width="0" height="4" fill="#c4502f" />
            <g id="s3-st1"><circle id="s3-n1" cx="8" cy="23" r="8" fill="#1d1b19" /><text class="lbl s3-t" x="0" y="72" fill="#1d1b19">01 Captación</text><text class="desc" x="0" y="112" fill="#1d1b19" opacity="0.72">Florecen antes que el cultivo</text></g>
            <g id="s3-st2"><circle id="s3-n2" cx="568" cy="23" r="8" fill="#1d1b19" opacity="0.3" /><text class="lbl s3-t" x="560" y="72" fill="#1d1b19">02 Desborde</text><text class="desc" x="560" y="112" fill="#1d1b19" opacity="0.72">Los polinizadores pasan al cultivo</text></g>
            <g id="s3-st3"><circle id="s3-n3" cx="1128" cy="23" r="8" fill="#1d1b19" opacity="0.3" /><text class="lbl s3-t" x="1120" y="72" fill="#1d1b19">03 Rotación</text><text class="desc" x="1120" y="112" fill="#1d1b19" opacity="0.72">La isla se mueve; el suelo queda fértil</text></g>
          </svg>
        </div>
      </div>

      <script>
        (function () {
          const mk = PN.mk;
          const DUR = 18.5;
          const ISL = [330, 790, 1250];
          const CY = 250;
          const SHIFT = 220;
          const $ = (id) => document.getElementById(id);
          const ins = Array.from(document.querySelectorAll("#s3-title .in"));

          PN.rows($("s3-rows"), 30, 80, 1660, 440, 36, 32, "#1d1b19", 7, 0.28);
          PN.rows($("s3-bloom"), 30, 80, 1660, 440, 36, 32, "#e5a02d", 9, 1);

          // suelo enriquecido donde estuvo cada isla
          const rich = ISL.map((x, i) => mk($("s3-rich"), "path", { d: PN.blob(x, CY, 150, 108, i * 1.3), fill: "#d9cbb0", opacity: 0 }));

          // islas: forma orgánica plana con flores
          const petals = ["#c4502f", "#e5a02d", "#f4efe6"];
          const islands = ISL.map((x, idx) => {
            const outer = mk($("s3-islands"), "g", {});
            const inner = mk(outer, "g", {});
            mk(inner, "path", { d: PN.blob(x, CY, 142, 100, idx * 1.3), fill: "#33504a" });
            const rnd = PN.rng(40 + idx * 7);
            const flowers = [];
            for (let k = 0; k < 11; k++) {
              const a = rnd() * 6.28;
              const d = Math.sqrt(rnd()) * 92;
              const f = PN.flower(inner, x + Math.cos(a) * d * 1.15, CY + Math.sin(a) * d * 0.8, 12 + rnd() * 6, petals[k % 3], "#1d1b19");
              flowers.push({ f: f, k: rnd() * 6.28, at: 4.9 + idx * 0.3 + k * 0.09 });
            }
            return { outer: outer, inner: inner, flowers: flowers, x: x };
          });

          // abejas: llegan cuando se dice "atraen polinizadores"
          const brnd = PN.rng(90);
          const bees = [];
          for (let i = 0; i < 12; i++) {
            bees.push({ bee: PN.bee($("s3-bees"), { scale: 1.15 }), i: i, home: ISL[i % 3], y0: 90 + brnd() * 300, tx: 160 + brnd() * 1360, ty: 110 + brnd() * 270, w: 0.9 + brnd() * 0.5, ph: brnd() * 6.28 });
          }
          const orbit = (b, t) => {
            const a = t * b.w + b.ph;
            return [b.home + (165 + 20 * (b.i % 3)) * Math.cos(a), CY + (105 + 12 * (b.i % 2)) * Math.sin(a * 1.3)];
          };
          const hover = (b, t) => [b.tx + 70 * Math.cos(t * 1.5 + b.ph), b.ty + 36 * Math.sin(t * 2.0 + b.ph)];
          const beePos = (b, t) => {
            const o = orbit(b, t);
            if (t < 9.3) return [-40, b.y0];
            if (t < 10.8) {
              const u = PN.ease((t - 9.3) / 1.5);
              return [-40 + (o[0] + 40) * u, b.y0 + (o[1] - b.y0) * u];
            }
            if (t < 12.2) return o;
            if (t < 14.0) {
              const u = PN.ease((t - 12.2) / 1.8);
              const h = hover(b, t);
              return [o[0] + (h[0] - o[0]) * u, o[1] + (h[1] - o[1]) * u - Math.sin(u * Math.PI) * 60];
            }
            return hover(b, t);
          };

          // nitrógeno: puntos que suben desde cada isla
          const nit = [];
          ISL.forEach((x, i) => {
            for (let k = 0; k < 4; k++) nit.push({ el: mk($("s3-nitro"), "circle", { r: 5, fill: "#c4502f" }), x: x + (k - 1.5) * 58, k: k, i: i });
          });

          const tl = gsap.timeline({ paused: true });

          PN.clock(tl, DUR, function (t) {
            islands.forEach((isl, i) => {
              isl.flowers.forEach((f) => {
                const u = PN.out((t - f.at) / 0.8);
                f.f.inner.setAttribute("transform", "rotate(" + (Math.sin(t * 1.2 + f.k) * 6).toFixed(2) + ") scale(" + u.toFixed(3) + ")");
              });
            });
            bees.forEach((b) => {
              const p = beePos(b, t);
              const p2 = beePos(b, t + 0.05);
              PN.fly(b.bee, p[0], p[1], p2[0] - p[0], p2[1] - p[1], 0.35);
              b.bee.flap(t, b.i);
              b.bee.g.setAttribute("opacity", (PN.clamp((t - 9.3) / 0.3, 0, 1) * (1 - PN.clamp((t - 14.6) / 1.0, 0, 1))).toFixed(2));
            });
            nit.forEach((n) => {
              const raw = (t - 12.8 - n.k * 0.45 - n.i * 0.2) / 2.2;
              if (raw < 0) {
                n.el.setAttribute("opacity", 0);
                return;
              }
              const u = raw - Math.floor(raw);
              const xs = n.i * 0 + (t > 14.6 ? 0 : 0);
              n.el.setAttribute("cx", (n.x + Math.sin(t * 2 + n.k) * 8).toFixed(1));
              n.el.setAttribute("cy", (CY + 30 - u * 150).toFixed(1));
              n.el.setAttribute("opacity", (PN.clamp(u / 0.2, 0, 1) * (1 - PN.clamp((u - 0.65) / 0.35, 0, 1)) * 0.9).toFixed(2));
            });
          });

          tl.fromTo("#s3-cam", { scale: 1, transformOrigin: "50% 60%" }, { scale: 1.025, duration: DUR, ease: "sine.inOut" }, 0);
          tl.set(ins, { yPercent: 128 }, 0);
          tl.to(ins[0], { yPercent: 0, duration: 0.9, ease: "power3.out" }, 2.0);
          tl.to(ins[1], { yPercent: 0, duration: 0.9, ease: "power3.out" }, 2.5);
          tl.to(ins[2], { yPercent: 0, duration: 0.9, ease: "power3.out" }, 3.4);
          tl.fromTo("#s3-map", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.5);
          tl.fromTo("#s3-steps", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 1.2);

          // 01 captación: aparecen las islas
          islands.forEach((isl, i) => tl.fromTo(isl.inner, { scale: 0, svgOrigin: isl.x + " " + CY }, { scale: 1, svgOrigin: isl.x + " " + CY, duration: 1.0, ease: "power3.out" }, 4.3 + i * 0.3));
          tl.to("#s3-prog", { attr: { width: 8 }, duration: 0.3 }, 4.3);

          // 02 desborde
          ["#s3-m0", "#s3-m1", "#s3-m2"].forEach((id, i) => tl.fromTo(id, { attr: { r: 0 } }, { attr: { r: 520 }, duration: 5.0, ease: "power2.out" }, 9.6 + i * 0.2));
          tl.to("#s3-n1", { opacity: 0.3, duration: 0.3 }, 9.3);
          tl.to("#s3-n2", { opacity: 1, duration: 0.3 }, 9.3);
          tl.to("#s3-prog", { attr: { width: 568 }, duration: 1.0, ease: "power2.inOut" }, 9.3);

          // 03 rotación
          tl.to("#s3-n2", { opacity: 0.3, duration: 0.3 }, 14.5);
          tl.to("#s3-n3", { opacity: 1, duration: 0.3 }, 14.5);
          tl.to("#s3-prog", { attr: { width: 1128 }, duration: 1.0, ease: "power2.inOut" }, 14.5);
          tl.to("#s3-year1", { opacity: 0, duration: 0.3 }, 14.5);
          tl.fromTo("#s3-year2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 14.7);
          tl.set("#s3-year2", { opacity: 0 }, 0);
          rich.forEach((r, i) => tl.to(r, { opacity: 1, duration: 0.9, ease: "power2.out" }, 14.7 + i * 0.15));
          islands.forEach((isl, i) => tl.to(isl.outer, { x: SHIFT, duration: 2.0, ease: "power3.inOut" }, 14.7 + i * 0.2));

          window.__timelines["s3-islas"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
