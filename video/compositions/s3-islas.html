    <template>
      <style>

        #s3-map {
          width: 1680px;

        }
        #s3-year {
          position: absolute;
          right: 40px;
          top: 36px;

        #s3-steps {
          position: absolute;
          left: 120px;

        .st {

        .st .n {

        .st .d {
          margin-top: 6px;

        }
        #s3-line {
          position: absolute;
          left: 0;
          top: 14px;

        }
        #s3-prog {
          position: absolute;
          left: 0;
          top: 14px;
          height: 3px;
          width: 0;
          background: #c8f25c;
        }
        .dot {
          position: absolute;
          top: 6px;
          width: 18px;
          height: 18px;
          border-radius: 50%;
          background: #223c2d;
        }
      </style>

      <div data-hf-id="hf-7kyk" id="root" data-composition-id="s3-islas" data-width="1920" data-height="1080">
        <div data-hf-id="hf-756d" id="s3-cam">
          <h2 data-hf-id="hf-18ms" id="s3-title" class="h"><span data-hf-id="hf-smev" class="ln"><span data-hf-id="hf-1vo8" class="in">Islas</span></span><span data-hf-id="hf-oupj" class="ln"><span data-hf-id="hf-y9p7" class="in">biodinámicas</span></span><span data-hf-id="hf-ogei" class="ln"><span data-hf-id="hf-k88c" class="in"><span data-hf-id="hf-e09a" class="mk" id="s3-mk"><span data-hf-id="hf-xgc4">rotativas</span></span></span></span></h2>

          <div data-hf-id="hf-y5wr" id="s3-frame" class="frame">
            <svg data-hf-id="hf-20sk" id="s3-map" viewBox="0 0 1680 500">
              <defs data-hf-id="hf-mh0t">
                <filter data-hf-id="hf-3xwf" id="s3-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur data-hf-id="hf-8w1q" stdDeviation="22" /></filter>
                <mask data-hf-id="hf-fqwq" id="s3-bloom-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1680" height="500">
                  <rect data-hf-id="hf-87ib" x="0" y="0" width="1680" height="500" fill="black" />
                  <g data-hf-id="hf-iv8l" filter="url(#s3-soft)" fill="white">
                    <circle data-hf-id="hf-yih2" id="s3-m0" cx="330" cy="260" r="0" />
                    <circle data-hf-id="hf-kdg1" id="s3-m1" cx="790" cy="260" r="0" />
                    <circle data-hf-id="hf-7lek" id="s3-m2" cx="1250" cy="260" r="0" />
                  </g>
                </mask>
              </defs>
              <g data-hf-id="hf-h0q2" id="s3-bands"></g>
              <g data-hf-id="hf-ae3h" id="s3-rows"></g>
              <g data-hf-id="hf-66xi" id="s3-bloom" mask="url(#s3-bloom-mask)"></g>
              <g data-hf-id="hf-w668" id="s3-rich"></g>
              <g data-hf-id="hf-qi18" id="s3-islands"></g>
              <g data-hf-id="hf-bdxa" id="s3-nitro"></g>
              <g data-hf-id="hf-jzwd" id="s3-bees"></g>
            </svg>
            <div data-hf-id="hf-rsfg" class="br tl"></div><div data-hf-id="hf-2rei" class="br tr"></div><div data-hf-id="hf-gsq6" class="br bl"></div><div data-hf-id="hf-a3p4" class="br rb"></div>
            <div data-hf-id="hf-ls9y" id="s3-year1" class="pill" style="left:100px;top:36px;bottom:auto">Año 1</div>
            <div data-hf-id="hf-joc6" id="s3-year2" class="pill" style="left:100px;top:36px;bottom:auto;color:#c8f25c;opacity:0">Año 2</div>
          </div>

          <div data-hf-id="hf-zmg1" id="s3-steps">
            <div data-hf-id="hf-99hi" id="s3-line"></div><div data-hf-id="hf-0vpg" id="s3-prog"></div>
            <div data-hf-id="hf-2p8j" id="s3-d1" class="dot" style="left:0;background:#c8f25c"></div><div data-hf-id="hf-tu0i" id="s3-d2" class="dot" style="left:560px"></div><div data-hf-id="hf-wuvi" id="s3-d3" class="dot" style="left:1120px"></div>
            <div data-hf-id="hf-0a46" class="st" style="left:0"><div data-hf-id="hf-7h2p" class="n">01</div><div data-hf-id="hf-58dm" class="t">Captación</div><div data-hf-id="hf-ottx" class="d">Florecen antes que el cultivo</div></div>
            <div data-hf-id="hf-x7u5" class="st" style="left:560px"><div data-hf-id="hf-8nzs" class="n">02</div><div data-hf-id="hf-auro" class="t">Desborde</div><div data-hf-id="hf-ja63" class="d">Los polinizadores pasan al cultivo</div></div>
            <div data-hf-id="hf-h7z6" class="st" style="left:1120px"><div data-hf-id="hf-89or" class="n">03</div><div data-hf-id="hf-ct7p" class="t">Rotación</div><div data-hf-id="hf-1br2" class="d">La isla se mueve; el suelo queda fértil</div></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const mk = PN.mk;
          const DUR = 18.5;
          const ISL = [330, 790, 1250];
          const CY = 260;
          const SHIFT = 220;
          const $ = (id) => document.getElementById(id);
          const ins = Array.from(document.querySelectorAll("#s3-title .in"));

          for (let i = 0; i < 7; i++) mk($("s3-bands"), "rect", { x: 0, y: i * 76, width: 1680, height: 76, fill: i % 2 ? "#14402a" : "#123524" });
          mk($("s3-bands"), "rect", { x: 0, y: 0, width: 1680, height: 500, fill: "#0f2d1f", opacity: 0.82 });
          PN.rows($("s3-rows"), 30, 80, 1660, 470, 36, 32, "#6ee7b7", 6, 0.3);
          PN.rows($("s3-bloom"), 30, 80, 1660, 470, 36, 32, "#c8f25c", 9, 1);

          // suelo enriquecido donde estuvo cada isla
          const rich = ISL.map((x, i) => mk($("s3-rich"), "path", { d: PN.blob(x, CY, 150, 108, i * 1.3), fill: "#7a6340", opacity: 0 }));

          // islas: tonos de verde con flores
          const petals = ["#ff7a5c", "#f5b83d", "#eef3e4"];
          const islands = ISL.map((x, idx) => {
            const outer = mk($("s3-islands"), "g", {});
            const inner = mk(outer, "g", {});
            mk(inner, "path", { d: PN.blob(x + 8, CY + 14, 142, 100, idx * 1.3), fill: "#000", opacity: 0.32 });
            mk(inner, "path", { d: PN.blob(x, CY, 142, 100, idx * 1.3), fill: "#1d5c3e" });
            mk(inner, "path", { d: PN.blob(x - 10, CY - 8, 110, 76, idx * 1.3 + 0.8), fill: "#2f7d4f" });
            mk(inner, "path", { d: PN.blob(x - 22, CY - 18, 66, 44, idx * 1.3 + 1.6), fill: "#54a36a", opacity: 0.7 });
            const rnd = PN.rng(40 + idx * 7);
            const flowers = [];
            for (let k = 0; k < 11; k++) {
              const a = rnd() * 6.28;
              const d = Math.sqrt(rnd()) * 92;
              const f = PN.flower(inner, x + Math.cos(a) * d * 1.15, CY + Math.sin(a) * d * 0.8, 12 + rnd() * 6, petals[k % 3], "#0a1a13");
              flowers.push({ f: f, k: rnd() * 6.28, at: 4.9 + idx * 0.3 + k * 0.09 });
            }
            return { outer: outer, inner: inner, flowers: flowers, x: x };
          });

          // abejas: llegan cuando se dice "atraen polinizadores"
          const brnd = PN.rng(90);
          const bees = [];
          for (let i = 0; i < 12; i++) {
            bees.push({ bee: PN.bee($("s3-bees"), { scale: 1.25 }), i: i, home: ISL[i % 3], y0: 90 + brnd() * 330, tx: 160 + brnd() * 1360, ty: 110 + brnd() * 300, w: 0.9 + brnd() * 0.5, ph: brnd() * 6.28 });
          }
          const orbit = (b, t) => {
            const a = t * b.w + b.ph;
            return [b.home + (165 + 20 * (b.i % 3)) * Math.cos(a), CY + (105 + 12 * (b.i % 2)) * Math.sin(a * 1.3)];
          };
          const hover = (b, t) => [b.tx + 70 * Math.cos(t * 1.5 + b.ph), b.ty + 36 * Math.sin(t * 2.0 + b.ph)];
          const beePos = (b, t) => {
            const o = orbit(b, t);
            if (t < 9.3) return [-40, b.y0];
            if (t < 10.8) {
              const u = PN.ease((t - 9.3) / 1.5);
              return [-40 + (o[0] + 40) * u, b.y0 + (o[1] - b.y0) * u];
            }
            if (t < 12.2) return o;
            if (t < 14.0) {
              const u = PN.ease((t - 12.2) / 1.8);
              const h = hover(b, t);
              return [o[0] + (h[0] - o[0]) * u, o[1] + (h[1] - o[1]) * u - Math.sin(u * Math.PI) * 60];
            }
            return hover(b, t);
          };

          // nitrógeno: puntos que suben desde cada isla
          const nit = [];
          ISL.forEach((x, i) => {
            for (let k = 0; k < 4; k++) nit.push({ el: mk($("s3-nitro"), "circle", { r: 5, fill: "#c8f25c" }), x: x + (k - 1.5) * 58, k: k, i: i });
          });

          const tl = gsap.timeline({ paused: true });

          PN.clock(tl, DUR, function (t) {
            islands.forEach((isl) => {
              isl.flowers.forEach((f) => {
                const u = PN.out((t - f.at) / 0.8);
                f.f.inner.setAttribute("transform", "rotate(" + (Math.sin(t * 1.2 + f.k) * 6).toFixed(2) + ") scale(" + u.toFixed(3) + ")");
              });
            });
            bees.forEach((b) => {
              const p = beePos(b, t);
              const p2 = beePos(b, t + 0.05);
              PN.fly(b.bee, p[0], p[1], p2[0] - p[0], p2[1] - p[1], 0.35);
              b.bee.flap(t, b.i);
              b.bee.g.setAttribute("opacity", (PN.clamp((t - 9.3) / 0.3, 0, 1) * (1 - PN.clamp((t - 14.6) / 1.0, 0, 1))).toFixed(2));
            });
            nit.forEach((n) => {
              const raw = (t - 12.8 - n.k * 0.45 - n.i * 0.2) / 2.2;
              if (raw < 0) {
                n.el.setAttribute("opacity", 0);
                return;
              }
              const u = raw - Math.floor(raw);
              n.el.setAttribute("cx", (n.x + Math.sin(t * 2 + n.k) * 8).toFixed(1));
              n.el.setAttribute("cy", (CY + 30 - u * 150).toFixed(1));
              n.el.setAttribute("opacity", (PN.clamp(u / 0.2, 0, 1) * (1 - PN.clamp((u - 0.65) / 0.35, 0, 1))).toFixed(2));
            });
          });

          tl.fromTo("#s3-cam", { scale: 1, transformOrigin: "50% 60%" }, { scale: 1.02, duration: DUR, ease: "sine.inOut" }, 0);
          tl.set(ins, { yPercent: 130 }, 0);
          tl.set("#s3-mk", { "--mk": 0, color: "#eef3e4" }, 0);
          tl.to(ins[0], { yPercent: 0, duration: 0.9, ease: "power3.out" }, 2.0);
          tl.to(ins[1], { yPercent: 0, duration: 0.9, ease: "power3.out" }, 2.5);
          tl.to(ins[2], { yPercent: 0, duration: 0.9, ease: "power3.out" }, 3.4);
          tl.to("#s3-mk", { "--mk": 1, duration: 0.7, ease: "power3.out" }, 4.0);
          tl.to("#s3-mk", { color: "#0a1a13", duration: 0.01 }, 4.35);
          tl.fromTo("#s3-frame", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.5);
          tl.fromTo("#s3-steps", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 1.2);

          // 01 captación: aparecen las islas
          islands.forEach((isl, i) => tl.fromTo(isl.inner, { scale: 0, svgOrigin: isl.x + " " + CY }, { scale: 1, svgOrigin: isl.x + " " + CY, duration: 1.0, ease: "power3.out" }, 4.3 + i * 0.3));

          // 02 desborde
          ["#s3-m0", "#s3-m1", "#s3-m2"].forEach((id, i) => tl.fromTo(id, { attr: { r: 0 } }, { attr: { r: 520 }, duration: 5.0, ease: "power2.out" }, 9.6 + i * 0.2));
          tl.to("#s3-d2", { backgroundColor: "#c8f25c", duration: 0.3 }, 9.3);
          tl.to("#s3-prog", { width: 560, duration: 1.0, ease: "power2.inOut" }, 9.3);

          // 03 rotación
          tl.to("#s3-d3", { backgroundColor: "#c8f25c", duration: 0.3 }, 14.5);
          tl.to("#s3-prog", { width: 1120, duration: 1.0, ease: "power2.inOut" }, 14.5);
          tl.to("#s3-year1", { opacity: 0, duration: 0.3 }, 14.5);
          tl.to("#s3-year2", { opacity: 1, duration: 0.4 }, 14.7);
          rich.forEach((r, i) => tl.to(r, { opacity: 1, duration: 0.9, ease: "power2.out" }, 14.7 + i * 0.15));
          islands.forEach((isl, i) => tl.to(isl.outer, { x: SHIFT, duration: 2.0, ease: "power3.inOut" }, 14.7 + i * 0.2));

          window.__timelines["s3-islas"] = tl;
        })();
      </script>
    </template>
  </body>
