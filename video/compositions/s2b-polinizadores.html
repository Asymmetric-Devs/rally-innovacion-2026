<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <!--
        SECCIÓN NUEVA: LOS POLINIZADORES (25 s). Pone el foco en el problema del desafío:
        la disminución de polinizadores nativos, sus amenazas locales y el riesgo para los alimentos y la biodiversidad.
        La voz es la grabación del equipo (assets/vo/vo2b-polinizadores.m4a). Los tiempos de abajo salen de sus palabras
        (tiempo de escena = tiempo de la voz + 0,5).
      -->
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Montserrat", sans-serif;
        }
        #s2b-cam {
          position: absolute;
          inset: 0;
        }
        .h2b {
          top: 128px;
          font-size: 82px;
          width: 1680px;
          white-space: nowrap;
        }
        #s2b-frame {
          left: 120px;
          top: 360px;
          width: 1680px;
          height: 560px;
        }
        #s2b-svg {
          width: 1680px;
          height: 560px;
        }
        .tt {
          font-family: "Montserrat", sans-serif;
          font-weight: 900;
          font-size: 40px;
          letter-spacing: -0.03em;
          fill: #12301f;
        }
        .dd {
          font-family: "Montserrat", sans-serif;
          font-weight: 400;
          font-size: 26px;
          fill: #5a7564;
        }
        .mo {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 700;
          font-size: 20px;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          fill: #5a7564;
        }
      </style>

      <div data-hf-id="hf-o922" id="root" data-composition-id="s2b-polinizadores" data-width="1920" data-height="1080">
        <div data-hf-id="hf-dr42" id="s2b-cam">
          <h2 data-hf-id="hf-5hkq" id="s2b-h1" class="h h2b"><span data-hf-id="hf-smev" class="ln"><span data-hf-id="hf-wipp" class="in">Detrás de cada cultivo,</span></span><span data-hf-id="hf-oupj" class="ln"><span data-hf-id="hf-qd52" class="in">los <span data-hf-id="hf-zqsk" class="mk" id="s2b-mk1"><span data-hf-id="hf-s0wg">polinizadores</span></span> nativos.</span></span></h2>
          <h2 data-hf-id="hf-1jgp" id="s2b-h2" class="h h2b"><span data-hf-id="hf-ogei" class="ln"><span data-hf-id="hf-wm24" class="in">Y están <span data-hf-id="hf-ama7" class="mk" id="s2b-mk2"><span data-hf-id="hf-ench">disminuyendo.</span></span></span></span></h2>
          <h2 data-hf-id="hf-0rsw" id="s2b-h3" class="h h2b"><span data-hf-id="hf-o23h" class="ln"><span data-hf-id="hf-klb4" class="in">Tres amenazas <span data-hf-id="hf-6o66" class="mk" id="s2b-mk3"><span data-hf-id="hf-floa">locales.</span></span></span></span></h2>
          <h2 data-hf-id="hf-wtov" id="s2b-h4" class="h h2b"><span data-hf-id="hf-qu8o" class="ln"><span data-hf-id="hf-qosj" class="in">Sin ellos, todo</span></span><span data-hf-id="hf-qfxn" class="ln"><span data-hf-id="hf-cpg2" class="in">está en <span data-hf-id="hf-fc21" class="mk" id="s2b-mk4"><span data-hf-id="hf-zjz8">riesgo.</span></span></span></span></h2>

          <div data-hf-id="hf-6hgg" id="s2b-frame" class="frame">
            <svg data-hf-id="hf-p0gd" id="s2b-svg" viewBox="0 0 1680 560">
              <defs data-hf-id="hf-mh0t">
                <clipPath data-hf-id="hf-wwtf" id="s2b-clip-fly"><ellipse data-hf-id="hf-w73x" cx="0" cy="6" rx="50" ry="15" /></clipPath>
                <clipPath data-hf-id="hf-shef" id="s2b-clip-bumble"><ellipse data-hf-id="hf-xsf9" cx="0" cy="0" rx="46" ry="34" /></clipPath>
              </defs>
              <!-- especies -->
              <g data-hf-id="hf-iu7r" id="s2b-species"></g>
              <!-- tendencia -->
              <g data-hf-id="hf-rzp8" id="s2b-trend">
                <text data-hf-id="hf-xszw" class="mo" x="420" y="486">Población de polinizadores nativos</text>
                <path data-hf-id="hf-g177" id="s2b-trend-line" d="M 940 462 C 1010 456, 1060 478, 1130 470 S 1230 494, 1300 488 S 1420 516, 1490 512 S 1580 532, 1620 530" fill="none" stroke="#ff7a5c" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
                <path data-hf-id="hf-6707" id="s2b-trend-head" d="M 1596 514 L 1628 534 L 1594 548" fill="none" stroke="#ff7a5c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
              </g>
              <!-- amenazas -->
              <g data-hf-id="hf-mwty" id="s2b-threats"></g>
              <!-- riesgo -->
              <g data-hf-id="hf-0ku2" id="s2b-risk">
                <g data-hf-id="hf-tgr3" id="s2b-risk1"><rect data-hf-id="hf-gqg3" x="42" y="196" width="780" height="92" fill="#fbfdf4" stroke="#c5d1b1" /><rect data-hf-id="hf-1r0a" x="42" y="196" width="8" height="92" fill="#ff7a5c" /><text data-hf-id="hf-ew0l" class="mo" x="76" y="232" style="fill:#ff7a5c">En riesgo</text><text data-hf-id="hf-z0zw" class="tt" x="76" y="272" style="font-size:36px">Producción de alimentos</text></g>
                <g data-hf-id="hf-ksv8" id="s2b-risk2"><rect data-hf-id="hf-w3a4" x="858" y="196" width="780" height="92" fill="#fbfdf4" stroke="#c5d1b1" /><rect data-hf-id="hf-tii3" x="858" y="196" width="8" height="92" fill="#ff7a5c" /><text data-hf-id="hf-sw8l" class="mo" x="892" y="232" style="fill:#ff7a5c">En riesgo</text><text data-hf-id="hf-lo37" class="tt" x="892" y="272" style="font-size:36px">Biodiversidad regional</text></g>
              </g>
            </svg>
            <div data-hf-id="hf-rsfg" class="br tl"></div><div data-hf-id="hf-2rei" class="br tr"></div><div data-hf-id="hf-gsq6" class="br bl"></div><div data-hf-id="hf-a3p4" class="br rb"></div>
            <div data-hf-id="hf-rzvn" id="s2b-p1" class="pill">Polinizadores nativos</div>
            <div data-hf-id="hf-j5nf" id="s2b-p2" class="pill warn" style="opacity:0">Amenazas locales</div>
            <div data-hf-id="hf-1lff" id="s2b-p3" class="pill warn" style="opacity:0">En riesgo</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const mk = PN.mk;
          const DUR = 25;
          const $ = (id) => document.getElementById(id);
          const ins = (id) => Array.from(document.querySelectorAll(id + " .in"));
          const H1 = ins("#s2b-h1"), H2 = ins("#s2b-h2"), H3 = ins("#s2b-h3"), H4 = ins("#s2b-h4");

          // ---------- tarjeta base ----------
          const card = (parent, x, y, w, h) => {
            const outer = mk(parent, "g", {});
            const g = mk(outer, "g", { transform: "translate(" + x + " " + y + ")" });
            mk(g, "rect", { x: 0, y: 0, width: w, height: h, fill: "#fbfdf4", stroke: "#c5d1b1" });
            mk(g, "rect", { x: 0, y: 0, width: w, height: 4, fill: "#8cc21f" });
            return { outer: outer, g: g };
          };

          // ---------- especies ----------
          const SP = [
            { name: "Abejas" },
            { name: "Abejorros" },
            { name: "Moscas" },
            { name: "Mariposas" },
            { name: "Colibríes" },
          ];
          const cards = SP.map((s, i) => {
            const c = card($("s2b-species"), 42 + i * 324, 36, 300, 380);
            const icon = mk(c.g, "g", { transform: "translate(150 190)" });
            const t = mk(c.g, "text", { x: 24, y: 352, class: "mo", style: "fill:#12301f;font-size:22px" });
            t.textContent = s.name;
            return { c: c, icon: icon, upd: function () {} };
          });

          // abeja
          const bee = PN.bee(cards[0].icon, { scale: 3.6, shadow: false });
          cards[0].upd = (t) => {
            bee.place(Math.sin(t * 2) * 10, Math.sin(t * 3.4) * 8, Math.sin(t * 2) * 4);
            bee.flap(t, 0);
          };

          // abejorro
          const bcl = mk(cards[1].icon, "g", {});
          const bWingB = mk(bcl, "ellipse", { cx: 0, cy: -34, rx: 20, ry: 34, fill: "#ffffff", opacity: 0.45 });
          mk(bcl, "ellipse", { cx: 0, cy: 0, rx: 46, ry: 34, fill: "#f5b83d" });
          const bb = mk(bcl, "g", { "clip-path": "url(#s2b-clip-bumble)", fill: "#12301f" });
          mk(bb, "rect", { x: -24, y: -40, width: 14, height: 80 });
          mk(bb, "rect", { x: 4, y: -40, width: 14, height: 80 });
          mk(bcl, "circle", { cx: -48, cy: 6, r: 11, fill: "#ffffff" });
          mk(bcl, "circle", { cx: 52, cy: -2, r: 18, fill: "#12301f" });
          mk(bcl, "circle", { cx: 58, cy: -6, r: 4, fill: "#8cc21f" });
          const bWingF = mk(bcl, "ellipse", { cx: 0, cy: -34, rx: 22, ry: 36, fill: "#ffffff", opacity: 0.7 });
          cards[1].upd = (t) => {
            bcl.setAttribute("transform", "translate(" + (Math.sin(t * 1.8 + 1) * 10).toFixed(1) + " " + (Math.sin(t * 3.1) * 7).toFixed(1) + ")");
            const a = Math.sin(t * 56) * 22;
            bWingB.setAttribute("transform", "rotate(" + (-20 + a) + " 0 -4)");
            bWingF.setAttribute("transform", "rotate(" + (14 - a) + " 0 -4)");
          };

          // mosca (sírfido)
          const fcl = mk(cards[2].icon, "g", {});
          const fW1 = mk(fcl, "ellipse", { cx: -4, cy: -14, rx: 30, ry: 12, fill: "#ffffff", opacity: 0.45 });
          mk(fcl, "ellipse", { cx: 0, cy: 6, rx: 50, ry: 15, fill: "#f5b83d" });
          const fb = mk(fcl, "g", { "clip-path": "url(#s2b-clip-fly)", fill: "#12301f" });
          [-34, -12, 10].forEach((x) => mk(fb, "rect", { x: x, y: -14, width: 9, height: 40 }));
          mk(fcl, "circle", { cx: 56, cy: 2, r: 17, fill: "#12301f" });
          mk(fcl, "circle", { cx: 61, cy: -3, r: 8, fill: "#138a5f" });
          const fW2 = mk(fcl, "ellipse", { cx: 6, cy: -14, rx: 32, ry: 13, fill: "#ffffff", opacity: 0.65 });
          cards[2].upd = (t) => {
            fcl.setAttribute("transform", "translate(" + (Math.sin(t * 2.2 + 2) * 12).toFixed(1) + " " + (Math.sin(t * 3.6 + 1) * 8).toFixed(1) + ")");
            const a = Math.sin(t * 60) * 20;
            fW1.setAttribute("transform", "rotate(" + (-14 + a) + " -4 -2)");
            fW2.setAttribute("transform", "rotate(" + (8 - a) + " 6 -2)");
          };

          // mariposa
          const mcl = mk(cards[3].icon, "g", {});
          const mL = mk(mcl, "g", {}), mR = mk(mcl, "g", {});
          [mL, mR].forEach((g) => {
            mk(g, "ellipse", { cx: 46, cy: -34, rx: 52, ry: 62, fill: "#ff7a5c", transform: "rotate(-30 46 -34)" });
            mk(g, "ellipse", { cx: 34, cy: 36, rx: 36, ry: 44, fill: "#f5b83d", transform: "rotate(24 34 36)" });
            mk(g, "circle", { cx: 54, cy: -40, r: 11, fill: "#12301f", opacity: 0.55 });
          });
          mk(mcl, "ellipse", { cx: 0, cy: 0, rx: 8, ry: 54, fill: "#ffffff" });
          mk(mcl, "path", { d: "M 0 -52 Q -10 -80 -24 -86 M 0 -52 Q 10 -80 24 -86", fill: "none", stroke: "#12301f", "stroke-width": 3, "stroke-linecap": "round" });
          cards[3].upd = (t) => {
            const s = 0.3 + 0.7 * Math.abs(Math.cos(t * 4.2));
            mL.setAttribute("transform", "scale(" + s.toFixed(3) + " 1)");
            mR.setAttribute("transform", "scale(" + (-s).toFixed(3) + " 1)");
            mcl.setAttribute("transform", "translate(" + (Math.sin(t * 1.6) * 8).toFixed(1) + " " + (Math.sin(t * 2.4) * 10).toFixed(1) + ")");
          };

          // colibrí
          const hcl = mk(cards[4].icon, "g", {});
          mk(hcl, "path", { d: "M -48 14 L -92 30 L -70 6 Z", fill: "#1d5c3e" });
          const hWing = mk(hcl, "path", { d: "M 0 -6 Q 16 -70 -26 -86 Q -30 -40 -8 -4 Z", fill: "#54a36a" });
          mk(hcl, "ellipse", { cx: 0, cy: 6, rx: 48, ry: 20, fill: "#2f7d4f", transform: "rotate(-14)" });
          mk(hcl, "ellipse", { cx: 12, cy: 14, rx: 30, ry: 12, fill: "#8cc21f", transform: "rotate(-14)" });
          mk(hcl, "circle", { cx: 44, cy: -20, r: 17, fill: "#1d5c3e" });
          mk(hcl, "circle", { cx: 49, cy: -23, r: 3.5, fill: "#12301f" });
          mk(hcl, "line", { x1: 58, y1: -22, x2: 122, y2: -40, stroke: "#12301f", "stroke-width": 4, "stroke-linecap": "round" });
          cards[4].upd = (t) => {
            hcl.setAttribute("transform", "translate(" + (Math.sin(t * 1.4) * 8).toFixed(1) + " " + (Math.sin(t * 2.8) * 6).toFixed(1) + ")");
            hWing.setAttribute("transform", "rotate(" + (Math.sin(t * 50) * 24 - 6) + " -6 -4)");
          };

          // ---------- amenazas ----------
          const TH = [
            { t: "Desmonte", d: "les quita el refugio" },
            { t: "Agroquímicos", d: "los envenenan" },
            { t: "Monocultivo", d: "los deja sin flores" },
          ];
          const tcards = TH.map((s, i) => {
            const c = card($("s2b-threats"), 30 + i * 550, 36, 520, 380);
            const icon = mk(c.g, "g", { transform: "translate(260 196)" });
            const t1 = mk(c.g, "text", { x: 28, y: 336, class: "tt" });
            t1.textContent = s.t;
            const t2 = mk(c.g, "text", { x: 28, y: 372, class: "dd" });
            t2.textContent = s.d;
            return { c: c, icon: icon };
          });
          // desmonte: un árbol que cae y queda el tocón
          const tree = mk(tcards[0].icon, "g", { transform: "translate(0 90)" });
          mk(tree, "rect", { x: -9, y: -14, width: 18, height: 14, fill: "#7a6340" });
          const fall = mk(tree, "g", {});
          mk(fall, "rect", { x: -9, y: -130, width: 18, height: 120, fill: "#7a6340" });
          mk(fall, "circle", { cx: 0, cy: -170, r: 62, fill: "#1d5c3e" });
          mk(fall, "circle", { cx: -22, cy: -186, r: 34, fill: "#2f7d4f" });
          mk(fall, "circle", { cx: 26, cy: -156, r: 30, fill: "#2f7d4f" });
          mk(tree, "path", { d: "M -34 -8 L 34 -22", stroke: "#ff7a5c", "stroke-width": 5, "stroke-linecap": "round", opacity: 0.0 });
          // agroquímicos: gotas sobre brotes que se marchitan
          const sprout = [-110, -40, 40, 110].map((x) => {
            const g = mk(tcards[1].icon, "g", { transform: "translate(" + x + " 96)" });
            const st = mk(g, "line", { x1: 0, y1: 0, x2: 0, y2: -46, stroke: "#2f7d4f", "stroke-width": 8, "stroke-linecap": "round" });
            const lf = mk(g, "circle", { cx: 0, cy: -58, r: 18, fill: "#54a36a" });
            return { st: st, lf: lf };
          });
          mk(tcards[1].icon, "path", { d: "M -60 -120 L 60 -120 L 40 -90 L -40 -90 Z", fill: "#5a7564" });
          mk(tcards[1].icon, "rect", { x: -14, y: -90, width: 28, height: 14, fill: "#12301f" });
          const drops = [];
          for (let k = 0; k < 14; k++) drops.push(mk(tcards[1].icon, "circle", { r: 5, fill: "#ff7a5c" }));
          // monocultivo: filas idénticas sin flores
          for (let r = 0; r < 4; r++) for (let c = 0; c < 8; c++) mk(tcards[2].icon, "circle", { cx: -168 + c * 48, cy: -52 + r * 46, r: 14, fill: "#2f7d4f" });
          const mbee = PN.bee(tcards[2].icon, { scale: 1.6, shadow: false });

          // ---------- reloj ----------
          const tl = PN.timeline();
          PN.clock(tl, DUR, function (t) {
            cards.forEach((c) => c.upd(t));
            // árbol: cae y queda el tocón
            const f = PN.ease(PN.clamp((t - 12.9) / 1.0, 0, 1));
            fall.setAttribute("transform", "rotate(" + (f * 78).toFixed(1) + ") translate(0 " + (f * 0).toFixed(1) + ")");
            fall.setAttribute("opacity", (1 - 0.55 * f).toFixed(2));
            // gotas
            drops.forEach((d, k) => {
              if (t < 13.8) {
                d.setAttribute("opacity", 0);
                return;
              }
              const u = (((t - 13.8) * 0.9 + k / 14) % 1 + 1) % 1;
              d.setAttribute("cx", (-48 + ((k * 37) % 96)).toFixed(1));
              d.setAttribute("cy", (-70 + u * 160).toFixed(1));
              d.setAttribute("opacity", (1 - u * 0.4).toFixed(2));
            });
            const wl = PN.clamp((t - 14.2) / 1.6, 0, 1);
            sprout.forEach((s, k) => {
              s.lf.setAttribute("fill", wl > 0.5 ? "#7a6340" : "#54a36a");
              s.lf.setAttribute("cy", (-58 + wl * 14).toFixed(1));
              s.st.setAttribute("y2", (-46 + wl * 14).toFixed(1));
            });
            // abeja que se acerca al monocultivo y no encuentra flores
            const a = (t - 15.8) * 1.3;
            mbee.place(-170 + (t > 15.8 ? 110 * (0.5 + 0.5 * Math.sin(a)) : 0), -130 + Math.sin(a * 2) * 10, 6);
            mbee.g.setAttribute("opacity", PN.clamp((t - 15.9) / 0.4, 0, 1).toFixed(2));
            mbee.flap(t, 0);
          });

          tl.fromTo("#s2b-cam", { scale: 1, transformOrigin: "50% 55%" }, { scale: 1.02, duration: DUR, ease: "sine.inOut" }, 0);
          tl.set([H1, H2, H3, H4], { yPercent: 130 }, 0);
          tl.set(["#s2b-mk1", "#s2b-mk2", "#s2b-mk3", "#s2b-mk4"], { "--mk": 0, color: "#12301f" }, 0);
          tl.set(["#s2b-trend", "#s2b-threats", "#s2b-risk"], { opacity: 0 }, 0);
          tl.set(cards.map((c) => c.c.outer), { opacity: 0 }, 0);
          tl.fromTo("#s2b-frame", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.4);

          const lineIn = (el, at) => tl.to(el, { yPercent: 0, duration: 0.9, ease: "power3.out" }, at);
          const lineOut = (el, at) => tl.to(el, { yPercent: -130, duration: 0.55, ease: "power3.in" }, at);
          const mark = (id, at) => {
            tl.to(id, { "--mk": 1, duration: 0.6, ease: "power3.out" }, at);
            tl.to(id, { color: "#12301f", duration: 0.01 }, at + 0.3);
          };

          // 1. los otros protagonistas
          lineIn(H1[0], 1.0);
          lineIn(H1[1], 5.4);
          mark("#s2b-mk1", 5.9);
          // 2. las especies y su retroceso
          [7.3, 7.6, 8.2, 8.75, 9.4].forEach((at, i) => tl.fromTo(cards[i].c.outer, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, at));
          lineOut(H1, 10.0);
          tl.set("#s2b-h1", { opacity: 0 }, 10.7);
          lineIn(H2[0], 10.2);
          mark("#s2b-mk2", 10.8);
          tl.to("#s2b-trend", { opacity: 1, duration: 0.4 }, 10.3);
          tl.to("#s2b-trend-line", { strokeDashoffset: 0, duration: 1.2, ease: "power1.inOut" }, 10.4);
          tl.to("#s2b-trend-head", { opacity: 1, duration: 0.3 }, 11.6);
          // 3. tres amenazas
          lineOut(H2, 11.8);
          tl.set("#s2b-h2", { opacity: 0 }, 12.4);
          lineIn(H3[0], 12.1);
          mark("#s2b-mk3", 12.8);
          tl.to(cards.map((c) => c.c.outer), { opacity: 0, duration: 0.4 }, 11.8);
          tl.to("#s2b-trend", { opacity: 0, duration: 0.4 }, 11.8);
          tl.to("#s2b-p1", { opacity: 0, duration: 0.3 }, 11.9);
          tl.to("#s2b-p2", { opacity: 1, duration: 0.4 }, 12.2);
          tl.set("#s2b-threats", { opacity: 1 }, 0);
          tcards.forEach((tc, i) => tl.fromTo(tc.c.outer, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, [12.3, 13.8, 15.8][i]));
          // 4. sin ellos, riesgo
          lineOut(H3, 17.8);
          tl.set("#s2b-h3", { opacity: 0 }, 18.4);
          lineIn(H4[0], 18.3);
          lineIn(H4[1], 18.7);
          mark("#s2b-mk4", 19.3);
          tl.to(tcards.map((tc) => tc.c.outer), { opacity: 0.3, duration: 0.6 }, 18.3);
          tl.to("#s2b-p2", { opacity: 0, duration: 0.3 }, 18.9);
          tl.to("#s2b-p3", { opacity: 1, duration: 0.4 }, 19.1);
          tl.fromTo("#s2b-risk", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 19.1);
          tl.fromTo("#s2b-risk1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 19.5);
          tl.fromTo("#s2b-risk2", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 20.9);

          window.__timelines["s2b-polinizadores"] = PN.raw(tl);
        })();
      </script>
    </template>
  </body>
</html>
