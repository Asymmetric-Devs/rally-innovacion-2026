<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" width="1500" height="560">
  <style>
    @font-face { font-family: "Instrument Serif"; font-style: normal; src: url("fonts/InstrumentSerif-Regular.woff2") format("woff2"); }
    @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("fonts/InstrumentSerif-Italic.woff2") format("woff2"); }
    @font-face { font-family: "Instrument Sans"; font-weight: 400 700; src: url("fonts/InstrumentSans.woff2") format("woff2"); }
  </style>
  <defs>
    <clipPath id="body"><ellipse cx="-8" cy="12" rx="92" ry="48" /></clipPath>
  </defs>

  <!-- marca -->
  <g id="mark">
    <path d="M 260 40 L 441.9 145 L 441.9 355 L 260 460 L 78.1 355 L 78.1 145 Z" transform="translate(0 40)" fill="#1d1b19" stroke="#1d1b19" stroke-width="10" stroke-linejoin="round" />
    <g transform="translate(250 304) rotate(-16) scale(1.18)">
      <!-- alas -->
      <ellipse cx="-8" cy="-74" rx="30" ry="68" fill="#f4efe6" opacity="0.92" transform="rotate(-18 -8 -10)" />
      <ellipse cx="34" cy="-72" rx="28" ry="64" fill="#f4efe6" opacity="0.72" transform="rotate(16 34 -10)" />
      <!-- cuerpo -->
      <path d="M -102 22 L -118 30 L -104 6 Z" fill="#e5a02d" />
      <ellipse cx="-8" cy="12" rx="92" ry="48" fill="#e5a02d" />
      <g clip-path="url(#body)" fill="#1d1b19">
        <rect x="-52" y="-50" width="20" height="120" /><rect x="-12" y="-50" width="20" height="120" />
      </g>
      <circle cx="88" cy="-2" r="36" fill="#f4efe6" />
      <circle cx="100" cy="-8" r="8" fill="#1d1b19" />
      <!-- antenas con nodos -->
      <g fill="none" stroke="#f4efe6" stroke-width="6" stroke-linecap="round">
        <path d="M 96 -34 Q 104 -62 138 -78" /><path d="M 114 -22 Q 142 -34 168 -26" />
      </g>
      <circle cx="144" cy="-82" r="11" fill="#c4502f" />
      <circle cx="174" cy="-24" r="10" fill="#e5a02d" />
    </g>
  </g>

  <!-- palabra -->
  <g id="word">
    <text x="600" y="318" font-family="Instrument Serif" font-size="248" fill="#1d1b19" letter-spacing="-4">Polli<tspan font-style="italic" fill="#c4502f" dx="12">Node</tspan></text>
    <rect x="610" y="378" width="64" height="5" fill="#c4502f" />
    <text x="610" y="436" font-family="Instrument Sans" font-weight="600" font-size="27" fill="#1d1b19" letter-spacing="7.5" opacity="0.78">POLINIZACIÓN CON SENSORES E IA</text>
  </g>
</svg>
